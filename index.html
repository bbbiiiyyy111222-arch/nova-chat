<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alive</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#eaf1ef;--panel:#fff;--ink:#12292b;--muted:#5d7578;--line:#d5e2df;--me:#0e6e6e;--them:#fff;--acc:#ff5a5f;--on:#22b573}
[data-theme=dark]{--bg:#0d1a1c;--panel:#14272a;--ink:#e6f2f0;--muted:#8aa5a8;--line:#23403f;--me:#15857f;--them:#1d3639}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--me);outline-offset:2px}
[hidden]{display:none!important}
input,textarea{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:11px 14px;width:100%}
.screen{min-height:100%;display:grid;place-items:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:30px 26px;width:min(390px,100%);text-align:center;display:grid;gap:10px}
.logo{width:68px;height:68px;border-radius:22px;background:var(--acc);display:grid;place-items:center;margin:0 auto}
.logo path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw 1.2s .2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.card h1{margin:6px 0 0;font-size:2rem;letter-spacing:-.02em}.card p{margin:0;color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px}
.tabs button{padding:8px;border-radius:11px;color:var(--muted)}.tabs .on{background:var(--panel);color:var(--ink);font-weight:700}
.go{background:var(--me);color:#fff;border-radius:14px;padding:12px;font-weight:700}
.lnk{color:var(--muted);font-size:.9rem;text-decoration:underline}
.err{color:var(--acc);min-height:1.3em;font-size:.9rem}
#main{height:100%;display:grid;grid-template-columns:350px 1fr}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:8px;padding:12px 14px}.top b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{border-radius:10px;padding:6px 10px;color:var(--muted)}.ib:hover{background:var(--bg);color:var(--ink)}
.srch{padding:0 14px 10px}
#list,.ul{overflow:auto;flex:1}
.row{display:flex;gap:11px;align-items:center;padding:10px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.row:hover{background:var(--bg)}.row.on{background:var(--bg);box-shadow:inset 3px 0 var(--me)}
.av{width:44px;height:44px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;flex:none;position:relative;background-size:cover;background-position:center}
.av i{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--on);border:2px solid var(--panel)}
.rt{flex:1;min-width:0}.rt div{display:flex;justify-content:space-between;gap:8px}
.rt .p{color:var(--muted);font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rt small{color:var(--muted)}
.bd{background:var(--acc);color:#fff;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.78rem;font-weight:700;padding:0 6px}
.empty{padding:24px 18px;color:var(--muted);text-align:center}
#chat{display:flex;flex-direction:column;min-height:0;min-width:0}
.ch{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.st{font-size:.82rem;color:var(--muted)}.st.on{color:var(--on)}.back{display:none}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:4px}
.day{align-self:center;color:var(--muted);font-size:.78rem;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 12px;margin:8px 0}
.m{max-width:min(500px,80%);padding:7px 12px 4px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--them);border:1px solid var(--line)}
.m.me{align-self:flex-end;background:var(--me);color:#fff;border-color:var(--me);border-bottom-right-radius:6px}
.m.th{align-self:flex-start;border-bottom-left-radius:6px}
.m .who{font-size:.78rem;font-weight:700}.m small{display:block;text-align:right;opacity:.65;font-size:.72rem}
.m img{display:block;max-width:100%;max-height:320px;border-radius:12px;margin:2px 0;cursor:zoom-in}
.m audio{display:block;max-width:100%;height:38px;margin:2px 0}
.comp{display:flex;gap:6px;align-items:flex-end;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line);position:relative}
.comp textarea{resize:none;max-height:120px;height:44px;flex:1}
.send{background:var(--me);color:#fff;border-radius:50%;width:44px;height:44px;flex:none;font-size:1.1rem}
#rbar{flex:1;display:flex;align-items:center;gap:8px;color:var(--acc);font-weight:700;height:44px}
#rbar:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
#emr{position:absolute;bottom:62px;left:12px;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px}
#emr button{font-size:1.4rem;padding:4px 7px;border-radius:10px}#emr button:hover{background:var(--bg)}
.ov{position:fixed;inset:0;background:rgba(8,20,22,.6);display:grid;place-items:center;z-index:50;padding:12px}
.md{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;width:min(420px,100%);max-height:86vh;display:flex;flex-direction:column;gap:10px}
.md h2{margin:0}.md .ul{max-height:44vh;margin-top:4px}.chips{color:var(--muted);font-size:.9rem}
.ov img.big{max-width:96vw;max-height:92vh;border-radius:12px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:90}
@media (max-width:760px){#main{grid-template-columns:1fr}#chat{display:none}#main.inchat aside{display:none}#main.inchat #chat{display:flex}.back{display:inline-block}}
@media (prefers-reduced-motion:reduce){.logo path{animation:none;stroke-dashoffset:0}#rbar:before{animation:none}}
</style>
</head>
<body>
<!-- Настройка ключей, если они не вписаны в файл -->
<div class="screen" id="setup" hidden><div class="card">
  <h1>Подключение</h1><p>Вставь данные из Supabase (Project Settings → API)</p>
  <input id="su" placeholder="Project URL (https://…supabase.co)"><input id="sk" placeholder="anon public key">
  <button class="go" id="ssave">Сохранить</button></div></div>

<div class="screen" id="auth" hidden><div class="card">
  <div class="logo"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M1 12h5l2.5-7 4 14 3-9 1.5 2H23" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h1>Alive</h1><p>Мессенджер, в котором все на связи</p>
  <div id="f1" style="display:grid;gap:10px">
    <div class="tabs"><button id="tl" class="on">Вход</button><button id="ts">Регистрация</button></div>
    <input id="un" maxlength="20" placeholder="Имя (2–20 символов)" hidden autocomplete="nickname">
    <input id="em" type="email" placeholder="Почта" autocomplete="email">
    <input id="pw" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
    <button class="go" id="go">Войти</button></div>
  <div class="err" id="err" role="alert"></div></div></div>

<div id="main" hidden>
  <aside>
    <div class="top"><button id="meb" aria-label="Профиль"></button><b id="mn"></b>
      <button class="ib" id="nc" title="Новый чат">Чат</button><button class="ib" id="ng" title="Новая группа">Группа</button>
      <button class="ib" id="th" aria-label="Сменить тему">◐</button></div>
    <div class="srch"><input id="q" placeholder="Поиск по чатам" aria-label="Поиск"></div>
    <div id="list"></div>
  </aside>
  <section id="chat">
    <div class="empty" id="noch" style="margin:auto">Выбери чат слева или создай новый.</div>
    <div class="ch" id="ch" hidden><button class="ib back" id="back" aria-label="Назад">←</button><div id="chav"></div>
      <div><b id="chn"></b><div class="st" id="chs"></div></div></div>
    <div id="msgs" hidden></div>
    <div class="comp" id="comp" hidden>
      <div id="emr" hidden></div>
      <button class="ib" id="att" aria-label="Прикрепить фото">📎</button>
      <button class="ib" id="emo" aria-label="Эмодзи">☺</button>
      <textarea id="inp" rows="1" placeholder="Написать сообщение" aria-label="Сообщение"></textarea>
      <button class="ib" id="rcx" aria-label="Отменить запись" hidden>✕</button>
      <div id="rbar" hidden><span id="rt">0:00</span></div>
      <button class="send" id="send" aria-label="Отправить">🎤</button>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
  </section>
</div>

<script>
(function(){
/* ===== Ключи Supabase: впиши сюда или введи на стартовом экране ===== */
var SUPABASE_URL="https://wqxeebqejexaatrtaxro.supabase.co",SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndxeGVlYnFlamV4YWF0cnRheHJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NTQ1MjEsImV4cCI6MjEwNzEzMDUyMX0.PMp3Bf6_efL7acEpHaguMa8c_ZfBljBCEF9hvSPDv04";
var GROQ_KEY="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",GROQ_MODEL="llama-3.3-70b-versatile";
/* ================================================================ */
var $=function(i){return document.getElementById(i)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function toast(t){var e=el("div","toast",t);e.setAttribute("role","status");document.body.appendChild(e);setTimeout(function(){e.remove()},3200)}
try{var cf=JSON.parse(localStorage.getItem("alive-cfg")||"{}");SUPABASE_URL=SUPABASE_URL||cf.u||"";SUPABASE_KEY=SUPABASE_KEY||cf.k||""}catch(e){}
function theme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("alive-theme",t)}catch(e){}}
try{theme(localStorage.getItem("alive-theme")||"light")}catch(e){}
$("th").onclick=function(){theme(document.documentElement.dataset.theme==="dark"?"light":"dark")};
if(!SUPABASE_URL||!SUPABASE_KEY){$("setup").hidden=false;
$("ssave").onclick=function(){var u=$("su").value.trim(),k=$("sk").value.trim();if(!u||!k)return;localStorage.setItem("alive-cfg",JSON.stringify({u:u,k:k}));location.reload()};return}
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

var user=null,P={},C={},M={},OL={},cur=null,q="",botTyping=false,pend="",mode="login";
function ru(m){m=m||"";if(/Invalid login/i.test(m))return"Неверная почта или пароль.";if(/not confirmed/i.test(m))return"Почта не подтверждена. Зарегистрируйся снова и введи код.";
if(/already registered|Database error|duplicate/i.test(m))return"Это имя или почта уже заняты.";if(/rate limit|seconds/i.test(m))return"Слишком много попыток. Подожди немного.";
if(/expired|invalid/i.test(m))return"Неверный или просроченный код.";if(/password/i.test(m))return"Пароль должен быть не короче 6 символов.";return"Ошибка: "+m}
function err(m){$("err").textContent=m||""}
function color(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return"hsl("+h+",55%,42%)"}
function avatar(n,url,sz,on){var a=el("div","av",url?"":n.charAt(0).toUpperCase());a.style.background=color(n);
if(url){a.style.backgroundImage='url("'+url+'")'}if(sz){a.style.width=a.style.height=sz+"px"}if(on)a.appendChild(el("i"));return a}
function tm(t){return new Date(t).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}
function dl(t){var d=new Date(t),n=new Date();if(d.toDateString()===n.toDateString())return"Сегодня";n.setDate(n.getDate()-1);
return d.toDateString()===n.toDateString()?"Вчера":d.toLocaleDateString("ru-RU",{day:"numeric",month:"long"})}

/* ===== вход, регистрация, код ===== */
function setMode(m){mode=m;$("tl").classList.toggle("on",m==="login");$("ts").classList.toggle("on",m==="signup");
$("un").hidden=m==="login";$("go").textContent=m==="login"?"Войти":"Создать аккаунт";
$("pw").autocomplete=m==="login"?"current-password":"new-password";err()}
$("tl").onclick=function(){setMode("login")};$("ts").onclick=function(){setMode("signup")};
async function submit(){err();var em=$("em").value.trim(),pw=$("pw").value;if(!em||!pw)return err("Введи почту и пароль.");
if(mode==="login"){var r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)err(ru(r.error.message));return}
var un=$("un").value.trim();if(un.length<2)return err("Имя должно быть не короче 2 символов.");if(pw.length<6)return err("Пароль должен быть не короче 6 символов.");
var s=await sb.auth.signUp({email:em,password:pw,options:{data:{username:un}}});if(s.error)return err(ru(s.error.message));
if(!s.data.session)err("Подтверждение почты включено в Supabase. Выключи: Authentication → Providers → Email → Confirm email.")}
$("go").onclick=submit;$("pw").onkeydown=function(e){if(e.key==="Enter")submit()};

/* ===== запуск после входа ===== */
async function boot(u){if(user&&user.id===u.id)return;user=u;
var p=await sb.from("profiles").select("*").eq("id",u.id).single();P[u.id]=p.data||{username:"Я"};
$("auth").hidden=true;$("main").hidden=false;fillMe();await loadChats();if(!favId()){await sb.rpc("start_favorites");await loadChats()}listen()}
function fillMe(){$("mn").textContent=P[user.id].username;$("meb").innerHTML="";$("meb").appendChild(avatar(P[user.id].username,P[user.id].avatar_url,38))}
sb.auth.onAuthStateChange(function(ev,s){if(s&&s.user)setTimeout(function(){boot(s.user)},0);else if(user)location.reload();else $("auth").hidden=false});

/* ===== данные ===== */
function addMsg(m){var a=M[m.chat_id]||(M[m.chat_id]=[]);if(m.id&&a.some(function(x){return x.id===m.id}))return;
m.t=m.t||Date.parse(m.created_at);a.push(m);a.sort(function(x,y){return x.t-y.t})}
async function loadChats(){
var r=await sb.from("chat_members").select("chat_id,user_id,last_read,profiles(username,avatar_url),chats(id,is_group,title,created_at)");
if(r.error)return toast("Не удалось загрузить чаты");
var cs={};r.data.forEach(function(x){var c=cs[x.chat_id]||(cs[x.chat_id]={id:x.chat_id,is_group:x.chats.is_group,title:x.chats.title,ct:Date.parse(x.chats.created_at),fav:x.chats.title==="__favorites__",members:[],lr:0});
c.members.push(x.user_id);if(x.profiles)P[x.user_id]=x.profiles;if(x.user_id===user.id)c.lr=Date.parse(x.last_read)});
/* локальный чат с ботом */
var b=[];try{b=JSON.parse(localStorage.getItem("alive-bot-"+user.id)||"[]")}catch(e){}
if(!b.length)b=[{id:"b0",sender_id:"bot",kind:"text",body:"Привет! Я Alive Бот на базе ИИ. Спрашивай что угодно: отвечу, помогу с текстом или идеей.",t:Date.now()}];
M.bot=b;cs.bot={id:"bot",bot:true,members:[],ct:0,lr:C.bot?C.bot.lr:0};C=cs;
var m=await sb.from("messages").select("*").order("created_at",{ascending:false}).limit(400);
(m.data||[]).reverse().forEach(addMsg);render()}
function listen(){
sb.channel("db").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},function(p){var m=p.new;
if(!C[m.chat_id]){loadChats();return}addMsg(m);if(!P[m.sender_id])loadChats();if(cur===m.chat_id)markRead();render()})
.on("postgres_changes",{event:"INSERT",schema:"public",table:"chat_members"},function(p){if(p.new.user_id===user.id)loadChats()}).subscribe();
var ch=sb.channel("online",{config:{presence:{key:user.id}}});
ch.on("presence",{event:"sync"},function(){OL=ch.presenceState();renderSide();renderHead()})
.subscribe(function(s){if(s==="SUBSCRIBED")ch.track({at:Date.now()})})}
function info(c){if(c.fav)return{name:"Избранное"};if(c.bot)return{name:"Alive Бот",on:true};
if(c.is_group)return{name:c.title||"Группа"};
var o=c.members.filter(function(x){return x!==user.id})[0],p=P[o]||{username:"?"};return{name:p.username,url:p.avatar_url,on:!!OL[o]}}
function favId(){for(var k in C)if(C[k].fav)return k;return null}
function pin(c){return c.fav?2:c.bot?1:0}
function lastT(c){var a=M[c.id]||[];return a.length?a[a.length-1].t:c.ct}
function unread(c){return(M[c.id]||[]).filter(function(m){return m.sender_id!==user.id&&m.t>c.lr}).length}
function markRead(){var c=C[cur],a=M[cur]||[],l=a[a.length-1];if(!c||!l||l.t<=c.lr)return;c.lr=l.t;
if(cur!=="bot")sb.from("chat_members").update({last_read:l.created_at}).eq("chat_id",cur).eq("user_id",user.id).then(function(){})}

/* ===== отрисовка ===== */
function pv(l){if(!l)return"Нет сообщений";var p=l.sender_id===user.id?"Вы: ":"";return p+(l.kind==="image"?"🖼 Фото":l.kind==="voice"?"🎤 Голосовое":l.body)}
function renderSide(){var l=$("list");l.innerHTML="";var n=q.toLowerCase(),tot=0;
Object.keys(C).map(function(k){return C[k]}).sort(function(a,b){return pin(b)-pin(a)||lastT(b)-lastT(a)}).forEach(function(c){
var i=info(c);if(n&&i.name.toLowerCase().indexOf(n)<0)return;var a=M[c.id]||[],last=a[a.length-1],u=unread(c);tot+=u;
var r=el("button","row"+(c.id===cur?" on":""));r.appendChild(avatar(i.name,i.url,44,i.on));
var t=el("div","rt"),h=el("div");h.appendChild(el("b",null,i.name));if(last)h.appendChild(el("small",null,tm(last.t)));
var s=el("div");s.appendChild(el("span","p",pv(last)));if(u)s.appendChild(el("span","bd",u));
t.appendChild(h);t.appendChild(s);r.appendChild(t);r.onclick=function(){openChat(c.id)};l.appendChild(r)});
if(!l.children.length)l.appendChild(el("div","empty","Ничего не найдено. Нажми «Чат», чтобы найти человека."));
document.title=(tot?"("+tot+") ":"")+"Alive"}
function renderHead(){var c=C[cur];if(!c)return;var i=info(c);$("chav").innerHTML="";$("chav").appendChild(avatar(i.name,i.url,40,i.on));$("chn").textContent=i.name;
var s=c.fav?"заметки, файлы и голосовые только для тебя":c.bot?(botTyping?"печатает…":"ИИ-помощник"):c.is_group?c.members.length+" участн.":(i.on?"в сети":"не в сети");
$("chs").textContent=s;$("chs").className="st"+(i.on?" on":"")}
function renderChat(){var has=!!C[cur];$("noch").hidden=has;$("ch").hidden=!has;$("msgs").hidden=!has;$("comp").hidden=!has;if(!has)return;renderHead();
var box=$("msgs"),a=M[cur]||[],c=C[cur],near=box.scrollHeight-box.scrollTop-box.clientHeight<90;box.innerHTML="";
if(!a.length)box.appendChild(el("div","empty","Сообщений пока нет. Напиши первым."));
var pd="",ps="";a.forEach(function(m){var d=dl(m.t);if(d!==pd){box.appendChild(el("div","day",d));pd=d;ps=""}
var mine=m.sender_id===user.id,d=el("div","m "+(mine?"me":"th"));
if(c.is_group&&!mine&&ps!==m.sender_id){var w=el("div","who",(P[m.sender_id]||{}).username||"?");w.style.color=color(w.textContent);d.appendChild(w)}
if(m.kind==="image"){var im=el("img");im.src=m.media_url;im.alt="Фото";im.loading="lazy";im.onclick=function(){bigImg(m.media_url)};d.appendChild(im)}
else if(m.kind==="voice"){var au=el("audio");au.controls=true;au.preload="metadata";au.src=m.media_url;d.appendChild(au)}
else d.appendChild(document.createTextNode(m.body));
var sm=el("small",null,tm(m.t)+" ");if(!c.fav&&favId()){var fb=el("button",null,"★");fb.title="В избранное";fb.setAttribute("aria-label","В избранное");fb.style.cssText="opacity:.7;padding:0 2px";fb.onclick=function(){toFav(m)};sm.appendChild(fb)}d.appendChild(sm);box.appendChild(d);ps=m.sender_id});
if(near||box.dataset.c!==cur){box.scrollTop=box.scrollHeight}box.dataset.c=cur}
function render(){renderSide();renderChat()}
function openChat(id){cur=id;markRead();$("main").classList.add("inchat");render();$("inp").focus()}
$("back").onclick=function(){cur=null;$("main").classList.remove("inchat");render()};
$("q").oninput=function(){q=this.value;renderSide()};
function bigImg(u){var o=el("div","ov"),i=el("img","big");i.src=u;o.appendChild(i);o.onclick=function(){o.remove()};document.body.appendChild(o)}

/* ===== отправка ===== */
var JK=["Почему программисты путают Хэллоуин и Рождество? Потому что 31 Oct = 25 Dec.","Баг — это не ошибка, а недокументированная фича."];
function botReply(t){var s=t.toLowerCase();
if(/привет|здравств|хай/.test(s))return"Привет! Рад тебя видеть.";
if(/умеешь|помощь/.test(s))return"Я умею говорить время («время»), шутить («шутка») и подбрасывать монетку («монетка»).";
if(/врем|час/.test(s))return"Сейчас "+tm(Date.now())+".";if(/шутк|анекдот/.test(s))return JK[Math.floor(Math.random()*JK.length)];
if(/монет/.test(s))return Math.random()<.5?"Выпал орёл.":"Выпала решка.";if(/как дела/.test(s))return"Отлично, я же живой! А у тебя?";
return["Интересно! Расскажи подробнее.","Понял тебя. Что ещё?"][Math.floor(Math.random()*2)]}
var SYS="Ты — Alive Бот, дружелюбный ИИ-помощник внутри мессенджера Alive. Отвечай по-русски, кратко и по делу. Если человек пишет на другом языке, отвечай на нём.";
async function aiReply(){var h=M.bot.slice(-14).map(function(m){return{role:m.sender_id==="bot"?"assistant":"user",content:m.body}});
var r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+GROQ_KEY},
body:JSON.stringify({model:GROQ_MODEL,messages:[{role:"system",content:SYS}].concat(h),temperature:.7,max_tokens:700})});
if(!r.ok)throw new Error("ai");var d=await r.json();return d.choices[0].message.content.trim()}
async function toFav(m){var f=favId();if(!f)return;var r=await sb.from("messages").insert({chat_id:f,sender_id:user.id,kind:m.kind,body:m.body,media_url:m.media_url||null}).select().single();
if(r.error)return toast("Не удалось сохранить");addMsg(r.data);render();toast("Сохранено в избранное")}
function botSave(){try{localStorage.setItem("alive-bot-"+user.id,JSON.stringify(M.bot.slice(-200)))}catch(e){}}
function botSay(t){M.bot.push({id:"u"+Date.now(),sender_id:user.id,kind:"text",body:t,t:Date.now()});C.bot.lr=Date.now();botTyping=true;botSave();render();
aiReply().catch(function(){return botReply(t)+"\n\n(ИИ сейчас недоступен, ответил по-простому.)"}).then(function(txt){botTyping=false;M.bot.push({id:"b"+Date.now(),sender_id:"bot",kind:"text",body:txt,t:Date.now()});if(cur==="bot")C.bot.lr=Date.now();botSave();render()})}
async function ins(kind,body,url){var r=await sb.from("messages").insert({chat_id:cur,sender_id:user.id,kind:kind,body:body,media_url:url}).select().single();
if(r.error)return toast("Не удалось отправить");addMsg(r.data);markRead();render()}
var inp=$("inp");
function fit(){inp.style.height="44px";inp.style.height=Math.min(inp.scrollHeight,120)+"px";$("send").textContent=inp.value.trim()?"➤":"🎤"}
async function doSend(){if(rec)return recStop(true);var t=inp.value.trim();if(!t)return recStart();inp.value="";fit();$("emr").hidden=true;
if(cur==="bot")botSay(t);else await ins("text",t,null)}
$("send").onclick=doSend;inp.oninput=fit;inp.onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();if(inp.value.trim())doSend()}};
["😀","😂","❤️","👍","🔥","🎉","😮","🙏"].forEach(function(x){var b=el("button",null,x);b.onclick=function(){inp.value+=x;fit();inp.focus()};$("emr").appendChild(b)});
$("emo").onclick=function(){$("emr").hidden=!$("emr").hidden};

/* ===== медиа: фото, голосовые, аватарки ===== */
function shrink(f,max,qu){return new Promise(function(res,rej){var im=new Image();im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){b?res(b):rej()},"image/jpeg",qu)};im.onerror=rej;im.src=URL.createObjectURL(f)})}
async function upload(b,ext,ct){var p=user.id+"/"+Date.now()+"."+ext,r=await sb.storage.from("media").upload(p,b,{contentType:ct});if(r.error)throw r.error;
return sb.storage.from("media").getPublicUrl(p).data.publicUrl}
$("att").onclick=function(){if(cur==="bot")return toast("Боту нельзя отправлять файлы");$("file").click()};
$("file").onchange=async function(){var f=this.files[0];this.value="";if(!f)return;toast("Отправляем фото…");
try{var b=await shrink(f,1280,.82);await ins("image",null,await upload(b,"jpg","image/jpeg"))}catch(e){toast("Не удалось отправить фото")}};
var rec=null,chunks=[],rtm=0,rint=0,mt="";
async function recStart(){if(cur==="bot")return toast("Боту нельзя отправлять голосовые");
var st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return toast("Нет доступа к микрофону")}
mt=window.MediaRecorder&&MediaRecorder.isTypeSupported("audio/webm")?"audio/webm":"audio/mp4";rec=new MediaRecorder(st,{mimeType:mt});chunks=[];
rec.ondataavailable=function(e){chunks.push(e.data)};rec.start();rtm=0;$("rt").textContent="0:00";
["att","emo","inp"].forEach(function(i){$(i).hidden=true});$("rbar").hidden=false;$("rcx").hidden=false;$("send").textContent="➤";
rint=setInterval(function(){rtm++;$("rt").textContent=Math.floor(rtm/60)+":"+("0"+rtm%60).slice(-2)},1000)}
function recStop(sendIt){var r=rec,ch=cur;rec=null;clearInterval(rint);
r.onstop=async function(){r.stream.getTracks().forEach(function(t){t.stop()});
if(sendIt&&rtm>0&&C[ch]){try{var b=new Blob(chunks,{type:mt});cur=ch;await ins("voice",null,await upload(b,mt.indexOf("webm")>-1?"webm":"m4a",mt))}catch(e){toast("Не удалось отправить голосовое")}}};
r.stop();["att","emo","inp"].forEach(function(i){$(i).hidden=false});$("rbar").hidden=true;$("rcx").hidden=true;fit()}
$("rcx").onclick=function(){recStop(false)};

/* ===== окна: новый чат, группа, профиль ===== */
function modal(title,fn){var o=el("div","ov"),b=el("div","md");b.appendChild(el("h2",null,title));o.appendChild(b);document.body.appendChild(o);
function close(){o.remove()}o.onclick=function(e){if(e.target===o)close()};fn(b,close)}
document.addEventListener("keydown",function(e){if(e.key==="Escape"){var o=document.querySelector(".ov");if(o)o.remove()}});
function pickUsers(box,onPick){var i=el("input");i.placeholder="Найти по имени";var l=el("div","ul"),tmo;box.appendChild(i);box.appendChild(l);
async function go(){var r=await sb.from("profiles").select("id,username,avatar_url").ilike("username","%"+i.value.trim()+"%").neq("id",user.id).limit(20);
l.innerHTML="";(r.data||[]).forEach(function(u){P[u.id]=u;var b=el("button","row");b.appendChild(avatar(u.username,u.avatar_url,40));b.appendChild(el("b",null,u.username));b.onclick=function(){onPick(u,b)};l.appendChild(b)});
if(!(r.data||[]).length)l.appendChild(el("div","empty","Никого не нашли"))}
i.oninput=function(){clearTimeout(tmo);tmo=setTimeout(go,250)};go();i.focus()}
$("nc").onclick=function(){modal("Новый чат",function(b,close){pickUsers(b,async function(u){var r=await sb.rpc("start_direct",{other:u.id});
if(r.error)return toast("Не удалось создать чат");close();await loadChats();openChat(r.data)})})};
$("ng").onclick=function(){modal("Новая группа",function(b,close){var t=el("input");t.placeholder="Название группы";t.maxLength=40;b.appendChild(t);
var sel={},chips=el("div","chips","Участники не выбраны");b.appendChild(chips);
pickUsers(b,function(u,btn){if(sel[u.id])delete sel[u.id];else sel[u.id]=u.username;btn.classList.toggle("on",!!sel[u.id]);
var n=Object.keys(sel).map(function(k){return sel[k]});chips.textContent=n.length?"Выбрано: "+n.join(", "):"Участники не выбраны"});
var g=el("button","go","Создать группу");g.onclick=async function(){var ids=Object.keys(sel);if(!t.value.trim())return toast("Введи название группы");if(!ids.length)return toast("Выбери хотя бы одного участника");
var r=await sb.rpc("create_group",{t:t.value.trim(),members:ids});if(r.error)return toast("Не удалось создать группу");close();await loadChats();openChat(r.data)};b.appendChild(g)})};
$("meb").onclick=function(){modal("Профиль",function(b,close){var box=el("div");box.style.cssText="display:grid;gap:10px;justify-items:center";
var me=P[user.id];box.appendChild(avatar(me.username,me.avatar_url,96));box.appendChild(el("b",null,me.username));box.appendChild(el("span","chips",user.email));
var f=el("input");f.type="file";f.accept="image/*";f.hidden=true;var c=el("button","go","Сменить фото");c.onclick=function(){f.click()};
f.onchange=async function(){if(!f.files[0])return;try{var u=await upload(await shrink(f.files[0],256,.85),"jpg","image/jpeg");
var r=await sb.from("profiles").update({avatar_url:u}).eq("id",user.id);if(r.error)throw r.error;P[user.id].avatar_url=u;fillMe();render();close();toast("Фото обновлено")}catch(e){toast("Не удалось сменить фото")}};
var x=el("button","lnk","Выйти из аккаунта");x.onclick=async function(){await sb.auth.signOut();location.reload()};
box.appendChild(f);box.appendChild(c);box.appendChild(x);b.appendChild(box)})};

sb.auth.getSession().then(function(r){if(!r.data.session)$("auth").hidden=false});
})();
</script>
