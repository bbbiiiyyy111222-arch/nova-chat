<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кликер Тюлень — Технические работы</title>
    <style>
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: sans-serif;
            text-align: center;
            padding: 40px 20px;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            max-width: 450px;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 { color: #38bdf8; margin-bottom: 20px; }
        
        /* Кнопка-Тюлень */
        .seal-btn {
            background: none; border: none; font-size: 5rem; cursor: pointer;
            transition: transform 0.1s; user-select: none;
        }
        .seal-btn:active { transform: scale(0.9); }
        .counter { color: #94a3b8; margin: 15px 0 30px; font-weight: bold; }

        /* Таймер */
        .timer { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .box { background: #0f172a; padding: 15px; border-radius: 10px; min-width: 70px; }
        .num { font-size: 1.8rem; font-weight: bold; color: #38bdf8; }
        .text { font-size: 0.8rem; color: #64748b; margin-top: 5px; }

        /* Элементы Админки */
        #auth-form {
            display: none; background: #0f172a; padding: 20px; border-radius: 12px; margin-top: 20px;
        }
        #admin-panel {
            display: none; background: #0f172a; padding: 20px; border-radius: 12px; margin-top: 20px; text-align: left;
        }
        input {
            width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px;
            border: 1px solid #334155; background: #1e293b; color: #fff; box-sizing: border-box;
        }
        button.action-btn {
            width: 100%; padding: 10px; background: #38bdf8; color: #0f172a;
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🦭 Кликер Тюлень</h1>
        <p>Идут технические работы. Скоро запуск!</p>

        <!-- Кликер -->
        <div>
            <button class="seal-btn" onclick="clickSeal()">🦭</button>
            <div class="counter">Кликов: <span id="clicks">0</span></div>
        </div>

        <!-- Простой Таймер -->
        <div class="timer">
            <div class="box"><div class="num" id="days">00</div><div class="text">Дни</div></div>
            <div class="box"><div class="num" id="hours">00</div><div class="text">Часы</div></div>
            <div class="box"><div class="num" id="mins">00</div><div class="text">Мин</div></div>
            <div class="box"><div class="num" id="secs">00</div><div class="text">Сек</div></div>
        </div>

        <!-- Форма ввода пароля -->
        <div id="auth-form">
            <p style="margin-bottom: 10px;">Введите пароль администратора:</p>
            <input type="password" id="pass-input" placeholder="Пароль...">
            <button class="action-btn" onclick="checkPassword()">Войти</button>
        </div>

        <!-- Панель управления -->
        <div id="admin-panel">
            <h3 style="color: #f472b6; margin-bottom: 10px;">⚙️ Управление временем</h3>
            <input type="datetime-local" id="datetime">
            <button class="action-btn" onclick="saveNewDate()">Сохранить время</button>
        </div>
    </div>

    <script>
        // Дата по умолчанию (на 7 дней вперед)
        let targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 7);
        targetDate = targetDate.getTime();

        // 1. Проверяем, есть ли в ссылке ?admin=true. Если есть — показываем ввод пароля
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === 'true') {
            document.getElementById('auth-form').style.display = 'block';
        }

        // 2. Функция проверки пароля
        function checkPassword() {
            const pass = document.getElementById('pass-input').value;
            if (pass === 'seal') {
                document.getElementById('auth-form').style.display = 'none'; // Скрываем ввод пароля
                document.getElementById('admin-panel').style.display = 'block'; // Показываем админку
            } else {
                alert('Неверный пароль!');
            }
        }

        // 3. Локальное сохранение даты (пока без базы данных)
        function saveNewDate() {
            const inputVal = document.getElementById('datetime').value;
            if (!inputVal) return alert('Выберите дату!');
            
            targetDate = new Date(inputVal).getTime();
            alert('Время обновлено на этой странице!');
        }

        // 4. Логика работы таймера
        function updateTimer() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.querySelector(".timer").innerHTML = "<b style='color:#34d399'>ИГРА ЗАПУЩЕНА!</b>";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("mins").innerText = String(mins).padStart(2, '0');
            document.getElementById("secs").innerText = String(secs).padStart(2, '0');
        }

        setInterval(updateTimer, 1000);
        updateTimer();

        // Простой кликер
        let count = 0;
        function clickSeal() {
            count++;
            document.getElementById("clicks").innerText = count;
        }
    </script>
</body>
</html>
