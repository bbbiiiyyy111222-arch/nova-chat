<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLASSIFIED // LEVEL 5 ACCESS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #030806;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* Фон с падающим кодом */
        canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.25;
        }

        /* Эффект полос старого монитора */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        /* Главный контейнер терминала */
        .terminal {
            position: relative;
            z-index: 3;
            width: 90%;
            max-width: 500px;
            padding: 30px 25px;
            border: 1px solid #00ff66;
            background: rgba(2, 15, 8, 0.85);
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.2), inset 0 0 15px rgba(0, 255, 102, 0.1);
            text-align: center;
            border-radius: 4px;
            transition: all 0.6s ease;
        }

        .badge {
            display: inline-block;
            border: 1px solid #ff3333;
            color: #ff3333;
            padding: 4px 10px;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            animation: blink 1.5s infinite;
        }

        h1 {
            font-size: 20px;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.7);
        }

        .typing-text {
            font-size: 14px;
            line-height: 1.6;
            color: #a8ffcb;
            min-height: 65px;
            margin-bottom: 25px;
        }

        /* Анимированная кнопка */
        .btn-access {
            background: transparent;
            color: #00ff66;
            border: 2px solid #00ff66;
            padding: 15px 30px;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
        }

        .btn-access:hover, .btn-access:active {
            background: #00ff66;
            color: #030806;
            box-shadow: 0 0 30px #00ff66;
        }

        /* Полоса загрузки при нажатии */
        .loader-box {
            display: none;
            margin-top: 20px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            border: 1px solid #00ff66;
            padding: 1px;
            margin-top: 8px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #00ff66;
            transition: width 0.1s linear;
        }

        /* Контейнер для видео */
        .video-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 10;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        video {
            width: 100%;
            max-width: 800px;
            max-height: 85vh;
            outline: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>
    <div class="scanlines"></div>

    <!-- Экран секретного архива -->
    <div class="terminal" id="terminal">
        <div class="badge">TOP SECRET // ARCHIVE #094</div>
        <h1>СЕКРЕТНЫЙ АРХИВ</h1>
        <div class="typing-text" id="text"></div>
        
        <button class="btn-access" id="openBtn" onclick="startHack()">ОТКРЫТЬ ДОСТУП</button>

        <div class="loader-box" id="loader">
            <div style="font-size: 12px;" id="status">РАСШИФРОВКА ФАЙЛА... 0%</div>
            <div class="progress-bar">
                <div class="progress-fill" id="fill"></div>
            </div>
        </div>
    </div>

    <!-- Экран с видео (появится после нажатия) -->
    <div class="video-container" id="videoBox">
        <!-- ВСТАВЬ СВОЁ ВИДЕО НИЖЕ ВМЕСТО video.mp4 -->
        <video id="prankVideo" controls playsinline>
            <source src="video.mp4" type="video/mp4">
            Ваш браузер не поддерживает видео.
        </video>
    </div>

    <script>
        // 1. Эффект печатающегося текста
        const message = "ОБНАРУЖЕНО НЕИЗВЕСТНОЕ ПОДКЛЮЧЕНИЕ.\nДОСТУП К ЗАСЕКРЕЧЕННЫМ МАТЕРИАЛАМ ОГРАНИЧЕН.\nПОДТВЕРДИТЕ ВХОД ДЛЯ ПРОСМОТРА...";
        let idx = 0;
        const textEl = document.getElementById('text');
        function typeWriter() {
            if (idx < message.length) {
                textEl.innerHTML += message.charAt(idx) === '\n' ? '<br>' : message.charAt(idx);
                idx++;
                setTimeout(typeWriter, 35);
            }
        }
        typeWriter();

        // 2. Анимация падающих символов (Матрица)
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const chars = '010101SECRETARCHIVEACCESSDENIEDFBISYSTEM';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(3, 8, 6, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 45);

        // 3. Анимация взлома при нажатии на кнопку и запуск видео
        function startHack() {
            document.getElementById('openBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            
            let progress = 0;
            const fill = document.getElementById('fill');
            const status = document.getElementById('status');

            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 12) + 5;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    status.innerText = "ДОСТУП РАЗРЕШЕН!";
                    setTimeout(() => {
                        document.getElementById('terminal').style.opacity = '0';
                        setTimeout(() => {
                            document.getElementById('videoBox').style.display = 'flex';
                            const vid = document.getElementById('prankVideo');
                            vid.play();
                        }, 500);
                    }, 400);
                }
                fill.style.width = progress + '%';
                status.innerText = `РАСШИФРОВКА ФАЙЛА... ${progress}%`;
            }, 120);
        }
    </script>
</body>
</html>
