<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>Страница недоступна</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
  document.documentElement.className += ' js';
  (function () {
    var l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500&display=swap';
    document.head.appendChild(l);
  })();
</script>
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500&display=swap"></noscript>
<style>
  :root { --ink:#0B1220; --ink-2:#121B2E; --line:rgba(255,255,255,.1); --mute:#9AA5B8; --accent:#C8102E; --ease:cubic-bezier(.2,.7,.2,1); }
  *,*::before,*::after { box-sizing:border-box; }
  html,body { height:100%; }
  html { background:var(--ink); -webkit-text-size-adjust:100%; }
  body { margin:0; font:400 16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
         color:#fff; -webkit-font-smoothing:antialiased; }
  h1,p { margin:0; }
  a { color:inherit; text-decoration:none; }
  svg { display:block; }
  ::selection { background:var(--accent); color:#fff; }
  .serif { font-family:'Source Serif 4',Georgia,'Times New Roman',serif; font-weight:500; }

  .stage { position:relative; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:48px 20px;
           background:
             radial-gradient(1100px 620px at 50% -10%, rgba(255,255,255,.05), transparent 60%),
             linear-gradient(180deg, var(--ink), var(--ink-2)); }

  .card { position:relative; z-index:2; width:100%; max-width:420px; text-align:center; opacity:0; animation:rise .8s .05s var(--ease) both; }

  .badge { position:relative; width:64px; height:64px; margin:0 auto 32px; display:flex; align-items:center; justify-content:center;
           border-radius:50%; border:1px solid var(--line); }
  .badge::before { content:""; position:absolute; inset:-8px; border-radius:50%; border:1px solid var(--line); opacity:0; animation:pulseRing 3s ease-out .6s infinite; }
  .badge svg { width:24px; height:24px; color:rgba(255,255,255,.75); }

  .code { font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--mute); margin-bottom:14px; }
  h1 { font-size:clamp(24px,5vw,32px); line-height:1.3; letter-spacing:-.01em; }
  .sub { margin-top:14px; font-size:14.5px; line-height:1.7; color:var(--mute); max-width:340px; margin-left:auto; margin-right:auto; }

  .divider { width:40px; height:1px; background:var(--line); margin:32px auto; }

  .tg { position:relative; isolation:isolate; display:inline-flex; align-items:center; gap:9px; background:#fff; color:var(--ink);
        font-size:14px; font-weight:500; padding:12px 26px; border-radius:6px; transition:transform .2s, background .2s; }
  .tg svg { width:16px; height:16px; }
  .tg:active { transform:scale(.97); }
  @media (hover:hover) { .tg:hover { background:#e9ecf2; transform:translate3d(0,-1px,0); } }

  @keyframes rise { from { opacity:0; transform:translate3d(0,14px,0); } to { opacity:1; transform:none; } }
  @keyframes pulseRing { 0% { transform:scale(1); opacity:.55; } 100% { transform:scale(1.18); opacity:0; } }

  @media (prefers-reduced-motion:reduce) { .badge::before { animation:none; } }
</style>
</head>
<body>

<div class="stage">
  <div class="card">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4.5" y="10.5" width="15" height="10" rx="2"/>
        <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
      </svg>
    </div>

    <div class="code">Ошибка доступа</div>
    <h1 class="serif">Страница недоступна</h1>
    <p class="sub">Попробуйте написать в Telegram, чтобы узнать подробности.</p>

    <div class="divider"></div>

    <a class="tg" href="https://t.me/miilo4ika1" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 3.5 2.7 11c-1 .4-1 1 .1 1.3l4.8 1.5 1.8 5.6c.2.7.4 1 .9 1 .4 0 .6-.2.9-.5l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3.1-14.5c.3-1.2-.3-1.7-1.5-1.4Z"/></svg>
      Написать в Telegram
    </a>
  </div>
</div>

</body>
</html>
