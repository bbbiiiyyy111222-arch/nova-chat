<!DOCTYPE html>
<html lang="ru">
<head>

<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:linear-gradient(165deg,var(--bg),var(--bg2)) fixed;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.4;padding-bottom:84px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 80%,transparent));backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding:10px 14px}
.hd{max-width:960px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.card h2,.card h3{margin:0 0 4px}.mu{color:var(--mu);font-size:.88rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.btn{background:linear-gradient(135deg,var(--ac),#ff9a3d);color:#2a1700;font-weight:800;border-radius:14px;padding:10px 18px;transition:transform .12s,filter .12s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn.sec{background:var(--pn2);color:var(--ink);font-weight:600}.btn.big{font-size:1.3rem;padding:15px 34px;border-radius:18px}.btn.gr{background:linear-gradient(135deg,var(--gr),#2fb97a);color:#04251a}

.ov{position:fixed;inset:0;background:rgba(5,8,22,.62);backdrop-filter:blur(5px);display:grid;place-items:center;z-index:60;padding:12px}
.md{background:linear-gradient(165deg,var(--bg2),var(--bg));border:1px solid var(--ln);border-radius:22px;padding:18px;width:min(580px,100%);max-height:90vh;overflow:auto;display:grid;gap:10px}
.ac{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:10px;display:grid;gap:6px}.at{font-weight:800}.ad{color:var(--mu);font-size:.86rem}
input,textarea{font:inherit;background:var(--pn2);color:var(--ink);border:1px solid var(--ln);border-radius:12px;padding:8px 12px;max-width:100%}textarea{width:100%;height:110px;font-size:.78rem}
.stat{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--ln)}
@media (prefers-reduced-motion:reduce){.reveal,.toast{animation:none}.btn{transition:none}}
</style>
</head>

<header><div class="hd"><div><h1 id="ttl">Король номеров</h1><div class="mu" id="sub"></div></div><div class="money" id="mon"></div></div><div id="evb"></div></header>

<script>
(()=>{
"use strict";
const $=i=>document.getElementById(i),KEY="nomera-save-v1";
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>{n=Math.round(n);return n>=1e9?(n/1e9).toFixed(2)+" млрд":n>=1e6?(n/1e6).toFixed(2)+" млн":n.toLocaleString("ru-RU")};
const $$=n=>"$"+fmt(n);
const ft=s=>{s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return h?h+"ч "+m+"м":m?m+"м "+c+"с":c+"с"};

/* ---------- данные ---------- */
const TR=[{n:"Обычный",c:"#aab3c8",b:10,min:0},{n:"Редкий",c:"#4aa8ff",b:50,min:15},{n:"Эпический",c:"#b36bff",b:250,min:38},{n:"Легендарный",c:"#ffb02e",b:1800,min:72},{n:"Мифический",c:"#ff4d6d",b:12000,min:115}];
const tierOf=s=>{let t=0;TR.forEach((x,i)=>{if(s>=x.min)t=i});return t};
const CL=[{n:"Эконом",i:"🚗",cost:50,cm:1,w:[78,17,4,.9,.1]},{n:"Комфорт",i:"🚙",cost:400,cm:3,w:[60,28,9,2.5,.5]},{n:"Бизнес",i:"🏎️",cost:3000,cm:10,w:[40,32,20,7,1]}];
const CARS=[
[{n:"Городок",i:"🚗",p:2500,inc:.04},{n:"Ласточка",i:"🚙",p:6000,inc:.05},{n:"Скаут",i:"🛻",p:12000,inc:.07}],
[{n:"Престиж",i:"🚘",p:8000,inc:.4},{n:"Комфорт-С",i:"🚖",p:20000,inc:.5},{n:"Магистраль",i:"🚐",p:40000,inc:.7}],
[{n:"Директор",i:"🚘",p:60000,inc:2.5},{n:"Сенатор",i:"🏎️",p:150000,inc:3.5},{n:"Президент",i:"🚁",p:400000,inc:5}]];
const ST=[
{id:"CA",n:"Калифорния",t:"DLLLDDD",bg:["#ffffff","#dce6ff"],fg:"#1d3a8a",tag:"#c0392b",m:1},
{id:"NY",n:"Нью-Йорк",t:"LLL-DDDD",bg:["#fff1b8","#ffd966"],fg:"#13306b",tag:"#13306b",m:1.1},
{id:"TX",n:"Техас",t:"LLL DDDD",bg:["#ffffff","#e9edf5"],fg:"#1b1b1b",tag:"#b32020",m:1.15},
{id:"FL",n:"Флорида",t:"LLL LDD",bg:["#fffaf0","#ffe2b8"],fg:"#a3261a",tag:"#1b6b3a",m:1.2},
{id:"NV",n:"Невада",t:"DDD LDD",bg:["#e7f1ff","#b8d3ff"],fg:"#12305f",tag:"#7a4b00",m:1.3},
{id:"WA",n:"Вашингтон",t:"LLLDDDD",bg:["#f2fff6","#c5efd3"],fg:"#0f4a2f",tag:"#0f4a2f",m:1.2},
{id:"IL",n:"Иллинойс",t:"LL DDDDD",bg:["#fff","#ffd9d9"],fg:"#8a1c1c",tag:"#8a1c1c",m:1.15}];
const LET="ABCDEFGHJKLMNPRSTUVWXYZ",ABC="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const W3=["ACE","BIG","BOY","CAT","CEO","DOG","FOX","FUN","GUY","HOT","ICE","JET","KID","MAX","NEW","ONE","PRO","RED","SUN","TOP","VIP","WIN","WOW","ZIP","SKY","CAR","BAR","JAM"];
const VAN=[["BOSS","KING","CASH","LUCKY","FAST","HOTROD","TAXI","MAFIA","SPEED","TIGER","ALPHA","NINJA"],["MONEY","WINNER","TYCOON","MILLION","KINGPIN","BILLION","LEGEND","1","7777777"]];
const AREAS=["212","213","305","310","312","404","415","512","602","617","702","713","718","786","808","818","917","206","303","214"],PREM=["212","310","305","415","702","786","917","808"];
const UP=[
{id:"cap",n:"Склад",i:"📦",d:"+8 мест для номеров за уровень",max:10,c:200,g:1.6},
{id:"luck",n:"Удача",i:"🍀",d:"+4% к шансу редких номеров за уровень",max:15,c:500,g:1.7},
{id:"neg",n:"Переговоры",i:"🤝",d:"+4% к цене продажи за уровень",max:20,c:400,g:1.55},
{id:"lic",n:"Лицензии штатов",i:"🗺️",d:"Открывает новый штат с особыми номерами",max:5,c:3000,g:3},
{id:"brk",n:"Брокер",i:"💼",d:"Сам продаёт лишнее: ур.1 обычные, ур.2 ещё и редкие",max:2,c:1500,g:10},
{id:"bot",n:"Робот-крутильщик",i:"🤖",d:"Сам крутит выбранный класс. Каждый уровень ускоряет",max:8,c:5000,g:2},
{id:"call",n:"Колл-центр",i:"📞",d:"+5% к цене телефонных номеров за уровень",max:10,c:800,g:1.6},
{id:"auc",n:"Аукционный дом",i:"🔨",d:"+10% к наградам за заказы за уровень",max:5,c:2500,g:2}];
const EVS=[{n:"Ажиотаж на редкие номера",d:"Редкие стоят на 40% больше",t:1,m:1.4},{n:"Охота за эпиками",d:"Эпические стоят на 40% больше",t:2,m:1.4},{n:"Коллекционеры вышли на рынок",d:"Легендарные стоят на 30% больше",t:3,m:1.3},
{n:"Спад на обычные",d:"Обычные номера дешевле на 30%",t:0,m:.7},{n:"Фестиваль в Техасе",d:"Номера Техаса дороже на 50%",st:"TX",m:1.5},{n:"Бум телефонов",d:"Телефонные номера дороже на 30%",k:"ph",m:1.3},{n:"Налоговая проверка",d:"Все цены ниже на 15%",all:1,m:.85}];
const OT=[["палиндром",t=>t.pal],["тройка одинаковых цифр",t=>t.trip||t.same],["красивая последовательность",t=>t.run],["счастливые семёрки (777)",t=>t.seven],["слово из букв",t=>t.word],["низкий номер",t=>t.low],["редкость Редкий или выше",(t,i)=>i.tier>=1],["редкость Эпический или выше",(t,i)=>i.tier>=2]];

/* ---------- состояние ---------- */
const def=()=>({money:300,earn:0,spins:0,sold:0,orders:0,inv:[],last:null,cars:[[1,0,0],[0,0,0],[0,0,0]],up:{},states:["CA","NY"],alb:{},albDone:{},ach:{},kind:"p",cl:0,ord:[],ev:null,evNext:0,off:0,spd:1,
day:{last:"",n:0},sound:true,fast:false,auto:false,theme:"night",pw:"admin",adm:{luck:1,price:1,free:false,cap:false,force:-1},t:Date.now(),born:Date.now(),id:1,rt:0,bt:0,best:0});
const merge=(a,b)=>{for(const k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k]))merge(a[k],b[k]);else a[k]=b[k]}return a};
let S=def(),tab="spin",adminOk=false,animating=false;
try{const r=localStorage.getItem(KEY);if(r)S=merge(def(),JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const now=()=>Date.now()+S.off,upl=id=>S.up[id]||0;

/* ---------- звук ---------- */
let ac=null;const beep=(f,d=.1,ty="triangle",v=.05,dl=0)=>{if(!S.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+dl;o.type=ty;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}};
const toast=m=>{const e=document.createElement("div");e.className="toast";e.textContent=m;e.setAttribute("role","status");document.body.appendChild(e);setTimeout(()=>e.remove(),3000)};

/* ---------- оценка номеров ---------- */
const isPal=s=>s.length>1&&s===[...s].reverse().join("");
const isRun=(D,k)=>{for(let i=0;i+k<=D.length;i++){let a=true,d=true;for(let j=1;j<k;j++){if(+D[i+j]!==+D[i+j-1]+1)a=false;if(+D[i+j]!==+D[i+j-1]-1)d=false}if(a||d)return true}return false};
const isLRun=L=>{for(let i=0;i+2<L.length;i++)if(ABC.indexOf(L[i+1])===ABC.indexOf(L[i])+1&&ABC.indexOf(L[i+2])===ABC.indexOf(L[i])+2)return true;return false};
const sD=D=>{const n=D.length;if(n<2)return 0;let s=0;const all=/^(\d)\1+$/.test(D);
if(all)s+=n>=4?75:n===3?55:12;else{if(/(\d)\1\1\1/.test(D))s+=45;else if(/(\d)\1\1/.test(D))s+=22;else{const m=D.match(/(\d)\1/g);if(m)s+=7*Math.min(2,m.length)}}
if(isRun(D,4))s+=40;else if(isRun(D,3))s+=14;if(n>=3&&isPal(D)&&!all)s+=16;
const v=parseInt(D,10);if(n>=3){if(v<=9)s+=70;else if(v<=99)s+=40;else if(n>=4&&v<=999)s+=15;if(v>0&&/00$/.test(D))s+=10;if(v>0&&/000$/.test(D))s+=15}
if(/777/.test(D))s+=25;if(/888/.test(D))s+=20;if(/007$|^007/.test(D))s+=40;if(/1337/.test(D))s+=40;return s};
const sL=L=>{const n=L.length;if(!n)return 0;let s=0;if(n>=2&&/^(.)\1+$/.test(L))s+=n>=3?50:10;else if(n>=3&&/(.)\1/.test(L))s+=8;if(n>=3&&isLRun(L))s+=30;if(W3.includes(L))s+=35;return s};
const trP=(L,D)=>({same:/^(\d)\1{2,}$/.test(D)||/^(.)\1{2,}$/.test(L),trip:/(\d)\1\1/.test(D),run:isRun(D,3)||isLRun(L),pal:D.length>=3&&isPal(D),low:D.length>=3&&parseInt(D,10)<=99,seven:/777/.test(D),word:W3.includes(L)});

/* ---------- генерация ---------- */
const rd=n=>{let s="";for(let i=0;i<n;i++)s+=ri(0,9);return s},rl=n=>{let s="";for(let i=0;i<n;i++)s+=LET[ri(0,LET.length-1)];return s},same=(c,n)=>String(c).repeat(n);
const setAt=(s,p,t)=>s.slice(0,p)+t+s.slice(p+t.length);
const pairD=n=>{const d=rd(n);if(n<2)return d;const p=ri(0,n-2),c=ri(0,9);return setAt(d,p,""+c+c)};
const tripD=n=>{if(n<3)return pairD(n);const p=ri(0,n-3),c=ri(0,9);return setAt(rd(n),p,""+c+c+c)};
const runD=(n,len)=>{len=Math.min(len,n);const dir=Math.random()<.7?1:-1,st=dir>0?ri(0,10-len):ri(len-1,9);let r="";for(let i=0;i<len;i++)r+=st+dir*i;const p=ri(0,n-len);return setAt(rd(n),p,r)};
const palD=n=>{const h=rd(Math.ceil(n/2));return h+[...h].reverse().join("").slice(n%2)};
const lowD=n=>String(ri(1,Math.random()<.5?9:99)).padStart(n,"0");
const luckyD=n=>{const t=pick(["777","888","007","1337"]);return n<t.length?rd(n):setAt(rd(n),ri(0,n-t.length),t)};
const roundD=n=>String(ri(1,9)).padEnd(Math.min(n,3),"0").padEnd(n,"0").slice(0,n);
const runL=()=>{const s=ri(0,23);return ABC.slice(s,s+3)};
const fam=(t,nL,nD)=>{const r=Math.random();let L=rl(nL),D=rd(nD);if(t===0)return{L,D};
if(t===1){if(r<.3)D=pairD(nD);else if(r<.55)D=runD(nD,3);else if(r<.75)D=palD(nD);else if(r<.88&&nL>=2)L=same(rl(1),nL);else D=roundD(nD)}
else if(t===2){if(r<.2)D=tripD(nD);else if(r<.4)D=runD(nD,4);else if(r<.55)D=luckyD(nD);else if(r<.7&&nL===3)L=pick(W3);else if(r<.85&&nL===3)L=runL();else{L=same(rl(1),nL);D=pairD(nD)}}
else if(t===3){if(r<.3)D=lowD(nD);else if(r<.5)D=same(ri(1,9),nD);else if(r<.7){L=same(rl(1),nL);D=tripD(nD)}else if(r<.85&&nL===3){L=pick(W3);D=lowD(nD)}else{D=luckyD(nD);L=same(rl(1),nL)}}
else{if(r<.4){L=same(rl(1),nL);D=lowD(nD)}else if(r<.7){L=same(rl(1),nL);D=same(ri(1,9),nD)}else{L=(nL===3?pick(W3):same(rl(1),nL));D=lowD(nD)}}
return{L,D}};
const famPh=t=>{const r=Math.random();let A=pick(AREAS),D=rd(4);
if(t===1){if(r<.4)D=pairD(4);else if(r<.7)D=runD(4,3);else D=palD(4)}
else if(t===2){if(r<.3)D=tripD(4);else if(r<.55)D=runD(4,4);else if(r<.8)A=pick(["800","888","877"]);else D=luckyD(4)}
else if(t===3){if(r<.35)D=lowD(4);else if(r<.65)D=same(ri(1,9),4);else A=same(pick([5,7,8,9]),3)}
else if(t===4){A=pick([same(7,3),same(8,3),"800","888"]);D=r<.5?same(ri(0,9),4):lowD(4)}
return{A,D}};
const wpick=w=>{let t=w.reduce((a,b)=>a+b,0),r=Math.random()*t;for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return i}return 0};

const want=forced>=0?forced:wpick(w);let best=null;
for(let a=0;a<60;a++){let it;
if(kind==="ph"){const f=famPh(want),s=sD(f.D)+.7*sD(f.A)+(PREM.includes(f.A)?12:0)+(/^8(00|88|77)$/.test(f.A)?25:0);it={k:"ph",A:f.A,D:f.D,score:s,tr:trP("",f.D)}}
else if(want>=3&&Math.random()<(want===4?.5:.3)){const wd=pick(VAN[want-3]),sc=TR[want].min+rnd(0,20);it={k:"p",st:pick(ST).id,van:wd,L:"",D:"",score:sc,tr:{same:false,trip:false,run:false,pal:isPal(wd),low:false,seven:/777/.test(wd),word:true}}}
else{const sid=pick(S.states),s=ST.find(x=>x.id===sid),nL=(s.t.match(/L/g)||[]).length,nD=(s.t.match(/D/g)||[]).length,f=fam(want,nL,nD);
it={k:"p",st:s.id,L:f.L,D:f.D,score:sD(f.D)+sL(f.L)+((f.L+f.D).length>=5&&isPal(f.L+f.D)?15:0),tr:trP(f.L,f.D)}}
it.tier=tierOf(it.score);best=it;if(it.tier===want)break}
return fin(best,cl)};
const toks=it=>{if(it.k==="ph")return[..."+1 ("].map(c=>({c})).concat([...it.A].map(c=>({c,s:"D"})),[...") 555-"].map(c=>({c})),[...it.D].map(c=>({c,s:"D"})));

const pl=(it,sm)=>{const T=toks(it).map(x=>`<span class="ch"${x.s?` data-s="${x.s}"`:""}>${x.c}</span>`).join("");
if(it.k==="ph")return`<div class="ph ${sm?"sm":""}" style="--rc:${TR[it.tier].c}"><span class="nums">${T}</span></div>`;
const s=ST.find(x=>x.id===it.st)||ST[0];return`<div class="plate ${sm?"sm":""}" style="--b1:${s.bg[0]};--b2:${s.bg[1]};--fg:${s.fg};--tag:${s.tag};--rc:${TR[it.tier].c}"><span class="tag">${s.n}</span><span class="nums">${T}</span></div>`};

const price=it=>{let p=it.v*CL[it.cl].cm*(1+.25*carsIn(it.cl))*(1+.04*upl("neg"))*(1+.01*albBonus())*evM(it)*S.adm.price;

if(a.startsWith("ad_"))return adm(a,id,el);

else if(a==="cls"){if(!canClass(+id)){toast(`Купи машину класса «${CL[+id].n}» в гараже`);return}S.cl=+id}

else if(a==="auto"){S.auto=!S.auto}
else if(a==="sellit"){const it=S.inv.find(x=>x.id===+id);if(it){const p=sell(it);toast(`Продано за ${$$(p)}`);beep(900,.1,"square",.04)}}

else if(a==="ful"){const od=S.ord.find(x=>x.id===+id),m=od&&orderItems(od);if(!m||!m.length)return toast("Нет подходящего номера");const it=m[0],p=Math.round(price(it)*od.m*(1+.1*upl("auc")));S.inv=S.inv.filter(x=>x.id!==it.id);if(S.last&&S.last.id===it.id)S.last=null;S.money+=p;S.earn+=p;S.orders++;S.ord=S.ord.map(o=>o.id===od.id?mkOrder():o);toast(`Заказ выполнен: +${$$(p)}`);beep(880,.3)}
else if(a==="car"){const c=+el.dataset.c,x=CARS[c][+id];if(S.cars[c][+id])return;if(S.money<x.p)return toast("Не хватает денег");S.money-=x.p;S.cars[c][+id]=1;toast(`Куплена машина: ${x.n}`);beep(660,.3)}
else if(a==="up"){const u=UP.find(x=>x.id===id),c=ucost(u);if(upl(id)>=u.max)return;if(S.money<c)return toast("Не хватает денег");S.money-=c;S.up[id]=upl(id)+1;if(id==="lic"){S.states.push(ST[1+upl(id)].id);toast(`Открыт штат: ${ST[1+upl(id)].n}`)}beep(700,.2)}
else if(a==="daily"){const d=new Date(now()).toDateString();if(S.day.last===d)return toast("Бонус за сегодня уже получен");const amt=Math.round(300*(1+Math.min(S.day.n,30)*.4));S.money+=amt;S.day.n++;S.day.last=d;beep(800,.3)}
else if(a==="snd")S.sound=!S.sound;else if(a==="fast")S.fast=!S.fast;else if(a==="theme")S.theme=S.theme==="night"?"day":"night";
else if(a==="adm"){openAdm();return}
else if(a==="close"){el.closest(".ov").remove();return}
save();render()};
const render_live=()=>{const y=scrollY;$("nav").innerHTML=TABS.map(t=>`<button class="${t[0]===tab?"on":""}" data-a="tab" data-id="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join("");live()};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&!b.disabled)act(b.dataset.a,b.dataset.id,b)});

/* админка */
let admO=null,admT="money";
const AT=[["money","Деньги"],["spin","Прокрутка"],["market","Рынок"],["stock","Склад и гараж"],["time","Время"],["data","Данные"]];
const openAdm=()=>{if(admO&&admO.isConnected)return;admO=document.createElement("div");admO.className="ov";admO.innerHTML=`<div class="md"></div>`;admO.onclick=e=>{if(e.target===admO)admO.remove()};document.body.appendChild(admO);drawAdm()};
const AC=(t,d,b)=>`<div class="ac"><div class="at">${t}</div><div class="ad">${d}</div><div class="row">${b}</div></div>`;
const TG=(k,l)=>`<button class="tg ${S.adm[k]?"on":""}" data-a="ad_tg" data-id="${k}">${l}: ${S.adm[k]?"ВКЛ":"выкл"}</button>`;
const B=(a,id,l,x)=>`<button class="btn sec" data-a="${a}" data-id="${id}" ${x||""}>${l}</button>`;
const drawAdm=()=>{if(!admO)return;const m=admO.querySelector(".md");
if(!adminOk){m.innerHTML=`<h2>Админка</h2><p class="mu">Введи пароль (по умолчанию: admin)</p><div class="row"><input id="adpw" type="password" autocomplete="off"><button class="btn" data-a="ad_login">Войти</button></div><button class="btn sec" data-a="close">Закрыть</button>`;return}
let h=`<div class="row sp"><h2 style="margin:0">Админка</h2><button class="btn sec" data-a="close">Закрыть</button></div><p class="mu">Под каждой кнопкой написано, что она делает. Всё применяется сразу.</p><div class="row">${AT.map(t=>`<button class="tg ${t[0]===admT?"on":""}" data-a="ad_tab" data-id="${t[0]}">${t[1]}</button>`).join("")}</div>`;
const inp=(id,v)=>`<input id="${id}" type="number" value="${v}" style="width:130px">`;
if(admT==="money")h+=AC("Выдать деньги","Добавляет деньги на счёт. Впиши сумму или нажми готовую кнопку.",`${inp("adn",1000)}${B("ad_add","x","Добавить сумму")}${B("ad_add",1e3,"+$1 тыс.")}${B("ad_add",1e6,"+$1 млн")}${B("ad_add",1e9,"+$1 млрд")}`)
+AC("Обнулить деньги","Ставит баланс в ноль, чтобы начать копить заново.",B("ad_zero","x","Обнулить"))
+AC("Бесплатные прокрутки","Прокрутки номеров ничего не стоят, можно крутить без остановки.",TG("free","Бесплатно"));
if(admT==="spin")h+=AC("Удача","Во сколько раз чаще выпадают редкие номера. ×20 почти каждый раз даёт что-то ценное.",[1,2,5,20,100].map(v=>`<button class="tg ${S.adm.luck===v?"on":""}" data-a="ad_luck" data-id="${v}">×${v}</button>`).join(""))
+AC("Гарантированная редкость","Каждая следующая прокрутка будет строго такой редкости, пока не выключишь.",`<button class="tg ${S.adm.force<0?"on":""}" data-a="ad_force" data-id="-1">Выкл</button>`+TR.map((t,i)=>`<button class="tg ${S.adm.force===i?"on":""}" data-a="ad_force" data-id="${i}">${t.n}</button>`).join(""))
+AC("Быстрая прокрутка","Пропускает анимацию барабанов, номер появляется сразу.",`<button class="tg ${S.fast?"on":""}" data-a="ad_fast">Мгновенно: ${S.fast?"ВКЛ":"выкл"}</button>`);
if(admT==="market")h+=AC("Множитель цен продажи","Во сколько раз выше или ниже платят за все номера.",[.5,1,2,5,10,100].map(v=>`<button class="tg ${S.adm.price===v?"on":""}" data-a="ad_price" data-id="${v}">×${v}</button>`).join(""))
+AC("Рыночное событие","Запускает случайное событие, которое меняет цены на 8 минут.",B("ad_ev","x","Запустить событие")+B("ad_evoff","x","Остановить событие"))
+AC("Заказы покупателей","Заменяет все заказы на новые.",B("ad_ords","x","Обновить заказы"));
if(admT==="stock")h+=AC("Склад без лимита","Склад принимает сколько угодно номеров.",TG("cap","Безлимит"))
+AC("Выдать номера","Добавляет на склад 10 номеров выбранной редкости, класс берётся текущий.",TR.map((t,i)=>B("ad_give",i,"+10 "+t.n)).join(""))
+AC("Очистить склад","Удаляет все номера со склада без оплаты.",B("ad_clr","x","Очистить"))
+AC("Гараж","Выдать все машины сразу или забрать все.",B("ad_cars","1","Выдать все")+B("ad_cars","0","Забрать все"))
+AC("Штаты","Открывает все штаты с особыми номерами.",B("ad_states","x","Открыть все штаты"));
if(admT==="time")h+=AC("Скорость дохода","Во сколько раз быстрее машины приносят деньги.",[1,10,100,1000].map(v=>`<button class="tg ${S.spd===v?"on":""}" data-a="ad_spd" data-id="${v}">×${v}</button>`).join(""))
+AC("Перемотка времени","Сдвигает часы вперёд: приходит доход, заканчиваются заказы и события.",[["1 час",1],["8 часов",8],["1 день",24],["7 дней",168]].map(x=>B("ad_shift",x[1],"+"+x[0])).join(""));
if(admT==="data")h+=AC("Достижения и альбомы","Открыть всё сразу или сбросить.",B("ad_ach","1","Открыть достижения")+B("ad_ach","0","Сбросить достижения")+B("ad_alb","1","Заполнить альбомы"))
+AC("Сохранение","Скопируй, чтобы перенести прогресс, или вставь сохранение и нажми «Загрузить».",`<textarea id="adj">${JSON.stringify(S).replace(/</g,"&lt;")}</textarea>`+B("ad_json","x","Загрузить"))
+AC("Сменить пароль","Закрывает админку от других людей.",`<input id="adnp" placeholder="Новый пароль">${B("ad_pw","x","Сменить")}`)
+AC("Полный сброс","Удаляет весь прогресс без возможности вернуть.",`<button class="btn sec" data-a="ad_hard" data-id="x" style="color:var(--bad)">Сбросить всё</button>`);
m.innerHTML=h};
const adm=(a,id,el)=>{const v=i=>+($(i)&&$(i).value)||0;
if(a==="ad_login"){if($("adpw").value===S.pw)adminOk=true;else toast("Неверный пароль");drawAdm();return}
if(!adminOk)return;
if(a==="ad_tab")admT=id;
else if(a==="ad_add"){S.money+=id==="x"?Math.max(0,v("adn")):+id}
else if(a==="ad_zero")S.money=0;
else if(a==="ad_tg")S.adm[id]=!S.adm[id];
else if(a==="ad_luck")S.adm.luck=+id;else if(a==="ad_force")S.adm.force=+id;else if(a==="ad_fast")S.fast=!S.fast;else if(a==="ad_price")S.adm.price=+id;
else if(a==="ad_ev"){S.ev={i:ri(0,EVS.length-1),end:now()+8*60000}}else if(a==="ad_evoff"){S.ev=null;S.evNext=now()+5*60000}
else if(a==="ad_ords")S.ord=[];
else if(a==="ad_give"){for(let i=0;i<10;i++){const c=canClass(S.cl)?S.cl:0;S.inv.push(genItem(S.kind,c,+id))}}
else if(a==="ad_clr")S.inv=[];
else if(a==="ad_cars")S.cars=S.cars.map(g=>g.map(()=>+id));
else if(a==="ad_states")S.states=ST.map(s=>s.id);
else if(a==="ad_spd")S.spd=+id;else if(a==="ad_shift")S.off+=+id*3600000;
else if(a==="ad_ach"){if(id==="1")check().forEach(q=>S.ach[q[0]]=1);else S.ach={}}
else if(a==="ad_alb"){ST.concat([{id:"PH"}]).forEach(s=>{S.alb[s.id]=[1,1,1,1,1];S.albDone[s.id]=1})}
else if(a==="ad_json"){try{S=merge(def(),JSON.parse($("adj").value.replace(/&lt;/g,"<")));toast("Загружено")}catch(e){return toast("Ошибка в JSON")}}
else if(a==="ad_pw"){const p=$("adnp").value.trim();if(!p)return toast("Введи пароль");S.pw=p;toast("Пароль изменён")}
else if(a==="ad_hard"){if(!confirm("Удалить весь прогресс?"))return;const pw=S.pw;S=def();S.pw=pw}
save();render();drawAdm()};
document.addEventListener("keydown",e=>{if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==="a"){e.preventDefault();openAdm()}if(e.key==="Escape"){const o=document.querySelector(".ov");if(o)o.remove()}});
$("ttl").addEventListener("click",(()=>{let n=0,t=0;return()=>{const c=Date.now();n=c-t<600?n+1:1;t=c;if(n>=5){n=0;openAdm()}}})());

/* запуск */
{const gone=Math.min(8*3600,Math.max(0,(now()-S.t)/1000)),before=S.money;tick();render();if(gone>120&&S.money-before>1)toast(`Пока тебя не было ${ft(gone)}: +${$$(S.money-before)} от машин`)}
setInterval(()=>{tick();live()},1000);
setInterval(()=>{save();if(!animating&&(tab==="ord"||tab==="inv"))render()},5000);
addEventListener("beforeunload",save);
window.NOMERA={get S(){return S},act,tick,render,genItem,price};
})();
</script>
