<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кликер Тюлень — Технические работы</title>
    
    <!-- Официальное подключение Supabase с защитой от CORS-ошибок -->
    <script src="https://cloudflare.com" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style>
        body { 
            background: #0f172a; 
            color: #f8fafc; 
            font-family: sans-serif; 
            text-align: center; 
            padding: 40px 20px; 
            user-select: none; 
        }
        .container { 
            background: #1e293b; 
            padding: 30px; 
            border-radius: 20px; 
            max-width: 450px; 
            margin: 0 auto; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
        }
        h1 { color: #38bdf8; margin-bottom: 20px; }
        
        .seal-btn { 
            background: none; 
            border: none; 
            cursor: pointer; 
            transition: transform 0.1s; 
            width: 150px; 
            height: 150px; 
            margin: 0 auto; 
            display: block; 
            -webkit-tap-highlight-color: transparent; 
        }
        .seal-btn:active { transform: scale(0.9); }
        .counter { color: #94a3b8; margin: 15px 0 5px; font-weight: bold; }
        
        .cheat-warning { 
            color: #ef4444; 
            font-size: 0.9rem; 
            font-weight: bold; 
            height: 20px; 
            margin-bottom: 15px; 
            visibility: hidden; 
        }
        .timer { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            margin-bottom: 30px; 
        }
        .box { 
            background: #0f172a; 
            padding: 15px; 
            border-radius: 10px; 
            min-width: 70px; 
        }
        .num { 
            font-size: 1.8rem; 
            font-weight: bold; 
            color: #38bdf8; 
        }
        .text { 
            font-size: 0.8rem; 
            color: #64748b; 
            margin-top: 5px; 
        }
        #auth-form, #admin-panel { 
            display: none; 
            background: #0f172a; 
            padding: 20px; 
            border-radius: 12px; 
            margin-top: 20px; 
            text-align: left; 
        }
        input { 
            width: 100%; 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 6px; 
            border: 1px solid #334155; 
            background: #1e293b; 
            color: #fff; 
            box-sizing: border-box; 
        }
        button.action-btn { 
            width: 100%; 
            padding: 10px; 
            background: #38bdf8; 
            color: #0f172a; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🦭 Кликер Тюлень</h1>
        <p>Идут технические работы. Скоро запуск!</p>

        <!-- Блок кликера -->
        <div>
            <button class="seal-btn" id="seal-trigger">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <circle cx="50" cy="55" r="35" fill="#94a3b8"/>
                    <ellipse cx="35" cy="45" r="5" rx="4" ry="6" fill="#0f172a"/>
                    <ellipse cx="65" cy="45" r="5" rx="4" ry="6" fill="#0f172a"/>
                    <circle cx="33" cy="43" r="1.5" fill="#ffffff"/>
                    <circle cx="63" cy="43" r="1.5" fill="#ffffff"/>
                    <ellipse cx="50" cy="54" r="8" rx="7" ry="5" fill="#475569"/>
                    <polygon points="46,54 54,54 50,59" fill="#0f172a"/>
                    <path d="M 44,62 Q 50,66 50,60 Q 50,66 56,62" stroke="#0f172a" stroke-width="2" fill="none"/>
                    <ellipse cx="50" cy="59" r="4" rx="5" ry="3" fill="#f472b6" opacity="0.5"/>
                    <path d="M 12,65 Q 5,60 8,72 Q 15,75 20,68" fill="#64748b"/>
                    <path d="M 88,65 Q 95,60 92,72 Q 85,75 80,68" fill="#64748b"/>
                    <path d="M 30,56 L 15,54 M 30,59 L 12,59 M 30,62 L 16,65" stroke="#0f172a" stroke-width="1.5"/>
                    <path d="M 70,56 L 85,54 M 70,59 L 88,59 M 70,62 L 84,65" stroke="#0f172a" stroke-width="1.5"/>
                </svg>
            </button>
            <div class="counter">Кликов: <span id="clicks">0</span></div>
            <div class="cheat-warning" id="warning-text">Обнаружен автокликер! Блокировка 3 сек.</div>
        </div>

        <!-- Блок таймера -->
        <div class="timer">
            <div class="box"><div class="num" id="days">00</div><div class="text">Дни</div></div>
            <div class="box"><div class="num" id="hours">00</div><div class="text">Часы</div></div>
            <div class="box"><div class="num" id="mins">00</div><div class="text">Мин</div></div>
            <div class="box"><div class="num" id="secs">00</div><div class="text">Сек</div></div>
        </div>

        <!-- Форма авторизации -->
        <div id="auth-form">
            <p style="margin-bottom: 10px; font-weight: bold;">🔑 Введите пароль администратора:</p>
            <input type="password" id="pass-input" placeholder="Пароль...">
            <button class="action-btn" onclick="checkPassword()">Войти в админку</button>
        </div>

        <!-- Панель управления -->
        <div id="admin-panel">
            <h3 style="color: #f472b6; margin-bottom: 10px;">⚙️ Управление временем для всех</h3>
            <input type="datetime-local" id="datetime">
            <button class="action-btn" onclick="saveNewDate()">Сохранить время</button>
        </div>
    </div>
    <script>
        // --- НАЧАЛО ЧАСТИ 2 (КЛИКЕР И АНТИЧИТ) ---
        let count = 0;
        let lastClickTime = 0;
        let clickIntervals = [];
        let isBlocked = false;

        const sealTrigger = document.getElementById("seal-trigger");

        function registerClick(e) {
            if (isBlocked) return;

            // Блокировка эмуляции кликов через консоль или скрипты
            if (e && !e.isTrusted) {
                triggerAntiCheat();
                return;
            }

            const now = performance.now();
            
            if (lastClickTime > 0) {
                const interval = now - lastClickTime;
                clickIntervals.push(interval);
                
                // Рассматриваем только окно из 10 последних кликов
                if (clickIntervals.length > 10) clickIntervals.shift();

                // Если интервалы между кликами слишком стабильно малы
                if (clickIntervals.length >= 5) {
                    const averageInterval = clickIntervals.reduce((a, b) => a + b, 0) / clickIntervals.length;
                    if (averageInterval < 90) {
                        triggerAntiCheat();
                        return;
                    }
                }
            }

            lastClickTime = now;
            count++;
            document.getElementById("clicks").innerText = count;
        }

        function triggerAntiCheat() {
            isBlocked = true;
            document.getElementById("warning-text").style.visibility = "visible";
            clickIntervals = [];
            
            setTimeout(() => {
                isBlocked = false;
                document.getElementById("warning-text").style.visibility = "hidden";
                lastClickTime = performance.now();
            }, 3000);
        }

        // Назначаем прослушивание кликов на кнопку
        sealTrigger.addEventListener("click", registerClick);
        // --- КОНЕЦ ЧАСТИ 2 ---
        // --- НАЧАЛО ЧАСТИ 3 (ПАРОЛЬ И ИНИЦИАЛИЗАЦИЯ SUPABASE) ---
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5dG15b3JycG5hcXpxdHdzZm5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTM5MDgsImV4cCI6MjEwMjcyOTkwOH0.nWolRM9vTEA5PRVKJ1VKJIyTyMPXvEWKqGEDgaG2GIw";
        
        let supabase;
        let targetDate = null;
        let timerInterval = null;

        // Открываем форму авторизации, если в адресной строке есть ?admin=true
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === 'true') {
            document.getElementById('auth-form').style.display = 'block';
        }

        // Функция проверки пароля
        window.checkPassword = function() {
            const pass = document.getElementById('pass-input').value;
            if (pass === 'seal') {
                document.getElementById('auth-form').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
            } else {
                alert('Неверный пароль!');
            }
        }

        // Функция безопасного старта Supabase
        function initSupabase() {
            if (!window.supabase || !window.supabase.createClient) {
                setTimeout(initSupabase, 300); // Если сеть лагает, мягко пробуем снова через 300мс
                return;
            }
            
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            loadTargetDate(); // Эту функцию мы добавим в Части 4

            // Подписка на Realtime изменения таблицы settings для всех игроков на лету
            supabase
                .channel('public:settings')
                .on('postgres_changes', { event: '*', filter: 'id=eq.main_timer', table: 'settings', schema: 'public' }, payload => {
                    if (payload.new && payload.new.target_date) {
                        targetDate = new Date(payload.new.target_date).getTime();
                    }
                })
                .subscribe();
        }

        setTimeout(initSupabase, 100);
        // --- КОНЕЦ ЧАСТИ 3 ---
        // --- НАЧАЛО ЧАСТИ 4 (ДАННЫЕ И ТАЙМЕР) ---
        async function loadTargetDate() {
            let { data } = await supabase
                .from('settings')
                .select('target_date')
                .eq('id', 'main_timer')
                .maybeSingle();

            if (!data) {
                const defaultDate = new Date();
                defaultDate.setDate(defaultDate.getDate() + 7);
                await supabase.from('settings').upsert({ id: 'main_timer', target_date: defaultDate.toISOString() });
                targetDate = defaultDate.getTime();
            } else {
                targetDate = new Date(data.target_date).getTime();
            }

            const localDate = new Date(targetDate);
            localDate.setMinutes(localDate.getMinutes() - localDate.getTimezoneOffset());
            document.getElementById('datetime').value = localDate.toISOString().slice(0, 16);
            
            startTimer();
        }

        window.saveNewDate = async function() {
            if (!supabase) return alert('База данных ещё не подключилась. Подождите 2 секунды.');
            
            const inputVal = document.getElementById('datetime').value;
            if (!inputVal) return alert('Выберите дату!');
            
            const isoDate = new Date(inputVal).toISOString();
            targetDate = new Date(inputVal).getTime();
            
            startTimer();

            const { error } = await supabase
                .from('settings')
                .upsert({ id: 'main_timer', target_date: isoDate });

            if (error) {
                alert('Ошибка: ' + error.message + '\n\nПодсказка: Отключите RLS для таблицы settings в панели Supabase!');
            } else {
                alert('Время успешно обновлено для всех игроков!');
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            
            function update() {
                if (!targetDate) return;
                const now = new Date().getTime();
                const distance = targetDate - now;

                if (distance < 0) {
                    document.querySelector(".timer").innerHTML = "<b style='color:#34d399; font-size: 1.2rem;'>ИГРА ЗАПУЩЕНА!</b>";
                    clearInterval(timerInterval);
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const mins = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = String(days).padStart(2, '0');
                document.getElementById("hours").innerText = String(hours).padStart(2, '0');
                document.getElementById("mins").innerText = String(mins).padStart(2, '0');
                document.getElementById("secs").innerText = String(secs).padStart(2, '0');
            }
            
            timerInterval = setInterval(update, 1000);
            update();
        }
        // --- КОНЕЦ ЧАСТИ 4 ---
    </script>
</body>
</html>
