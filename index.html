<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кликер Тюлень</title>
    <!-- Подключаем официальный клиент Supabase -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #818cf8, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        p { color: #cbd5e1; font-size: 1.1rem; margin-bottom: 30px; }
        .seal-stage { margin-bottom: 35px; }
        .seal-btn {
            background: none; border: none; font-size: 5rem; cursor: pointer;
            transition: transform 0.1s ease; user-select: none;
            filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.4));
        }
        .seal-btn:hover { transform: scale(1.08) rotate(5deg); }
        .seal-btn:active { transform: scale(0.92); }
        .counter-view { font-size: 0.9rem; color: #94a3b8; margin-top: 8px; font-weight: 600; }
        
        /* Таймер */
        .timer { display: flex; justify-content: space-between; gap: 12px; }
        .box {
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px 10px; border-radius: 16px; flex: 1;
        }
        .number { font-size: 1.8rem; font-weight: 700; color: #38bdf8; font-variant-numeric: tabular-nums; }
        .label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; margin-top: 4px; }

        /* Админ-панель (скрыта по умолчанию) */
        #admin-panel {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px dashed rgba(255,255,255,0.2);
            text-align: left;
        }
        #admin-panel h2 { font-size: 1.3rem; margin-bottom: 15px; color: #f472b6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 5px; }
        input[type="datetime-local"] {
            width: 100%; padding: 12px; border-radius: 10px; background: #0f172a;
            border: 1px solid #334155; color: #fff; font-size: 1rem;
        }
        .btn-save {
            width: 100%; padding: 12px; background: #38bdf8; color: #0f172a;
            border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem;
        }
        .btn-save:hover { background: #0ea5e9; }
        .status { font-size: 0.85rem; color: #34d399; margin-top: 8px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Основной контент сайта -->
        <div id="main-content">
            <h1>Кликер Тюлень</h1>
            <p>Идут технические работы. Скоро запуск!</p>

            <div class="seal-stage">
                <button class="seal-btn" id="seal" onclick="clickSeal()">🦭</button>
                <div class="counter-view">Тестовых кликов: <span id="clicks">0</span></div>
            </div>

            <div class="timer">
                <div class="box"><div class="number" id="days">00</div><div class="label">Дни</div></div>
                <div class="box"><div class="number" id="hours">00</div><div class="label">Часы</div></div>
                <div class="box"><div class="number" id="minutes">00</div><div class="label">Мин</div></div>
                <div class="box"><div class="number" id="seconds">00</div><div class="label">Сек</div></div>
            </div>
        </div>

        <!-- Панель Администратора -->
        <div id="admin-panel">
            <h2>⚙️ Панель управления временем</h2>
            <div class="form-group">
                <label for="datetime">Выберите новую дату и время завершения:</label>
                <input type="datetime-local" id="datetime">
            </div>
            <button class="btn-save" onclick="saveNewDate()">Обновить время для всех</button>
            <div class="status" id="status-msg">Сохранено успешно!</div>
        </div>
    </div>

    <script>
        // Инициализация Supabase. Замените на ваши ключи!
        const SUPABASE_URL = "ВАШ_SUPABASE_URL";
        const SUPABASE_ANON_KEY = "ВАШ_SUPABASE_ANON_KEY";
        const supabase = @supabase/supabase-js.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let targetDate = null;
        let timerInterval = null;

        // 1. Проверяем, открыта ли админка (например: ://site.com)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === 'true') {
            document.getElementById('admin-panel').style.display = 'block';
        }

        // 2. Получаем текущую дату из Supabase при загрузке страницы
        async function loadTargetDate() {
            const { data, error } = await supabase
                .from('settings')
                .select('target_date')
                .eq('id', 'main_timer')
                .single();

            if (data && data.target_date) {
                targetDate = new Date(data.target_date).getTime();
                
                // Заполняем инпут в админке текущим значением
                const localDate = new Date(data.target_date);
                localDate.setMinutes(localDate.getMinutes() - localDate.getTimezoneOffset());
                document.getElementById('datetime').value = localDate.toISOString().slice(0, 16);
                
                startTimer();
            }
        }

        // 3. Сохранение новой даты из админ-панели в БД
        async function saveNewDate() {
            const inputVal = document.getElementById('datetime').value;
            if (!inputVal) return alert('Выберите дату!');

            const isoDate = new Date(inputVal).toISOString();

            const { error } = await supabase
                .from('settings')
                .update({ target_date: isoDate })
                .eq('id', 'main_timer');

            if (error) {
                alert('Ошибка сохранения: ' + error.message);
            } else {
                const msg = document.getElementById('status-msg');
                msg.style.display = 'block';
                setTimeout(() => msg.style.display = 'none', 3000);
            }
        }

        // 4. Подписка на изменения в реальном времени (Realtime)
        // Чтобы изменения у админа мгновенно отображались у всех пользователей без перезагрузки
        supabase
            .channel('public:settings')
            .on('postgres_changes', { event: 'UPDATE', filter: 'id=eq.main_timer', table: 'settings', schema: 'public' }, payload => {
                targetDate = new Date(payload.new.target_date).getTime();
            })
            .subscribe();

        // 5. Логика работы самого таймера
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            
            function update() {
                if (!targetDate) return;
                const now = new Date().getTime();
                const distance = targetDate - now;

                if (distance < 0) {
                    document.getElementById("main-content").innerHTML = "<h1>🦭 Игра Запущена!</h1><p>Обновите страницу или перейдите в игру.</p>";
                    clearInterval(timerInterval);
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = String(days).padStart(2, '0');
                document.getElementById("hours").innerText = String(hours).padStart(2, '0');
                document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
                document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
            }
            
            timerInterval = setInterval(update, 1000);
            update();
        }

        // Кликер заглушка
        let count = 0;
        function clickSeal() {
            count++;
            document.getElementById("clicks").innerText = count;
        }

        loadTargetDate();
    </script>
</body>
</html>
