<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ERROR 403 // RESTRICTED NODE</title>
    <style>
        @import url('https://googleapis.com');
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #020305;
            color: #d0f0e0;
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }
        canvas#bgCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .crt-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 55%, rgba(0,0,0,0.85) 100%),
                        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 100%, 100% 3px;
            z-index: 2; pointer-events: none;
        }
        .hud-corner { position: fixed; width: 25px; height: 25px; border-color: rgba(0, 255, 170, 0.4); border-style: solid; z-index: 3; pointer-events: none; }
        .tl { top: 15px; left: 15px; border-width: 2px 0 0 2px; }
        .tr { top: 15px; right: 15px; border-width: 2px 2px 0 0; }
        .bl { bottom: 15px; left: 15px; border-width: 0 0 2px 2px; }
        .br { bottom: 15px; right: 15px; border-width: 0 2px 2px 0; }
        .rec-indicator { position: fixed; top: 20px; left: 50px; font-size: 12px; color: #ff2a55; letter-spacing: 2px; z-index: 3; display: flex; align-items: center; gap: 8px; }
        .rec-dot { width: 8px; height: 8px; background: #ff2a55; border-radius: 50%; box-shadow: 0 0 10px #ff2a55; animation: pulse 1.2s infinite; }
        .container {
            position: relative; z-index: 4; width: 92%; max-width: 440px;
            background: rgba(6, 12, 16, 0.75); backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 170, 0.25);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(0, 255, 170, 0.05);
            padding: 30px 20px; border-radius: 6px; text-align: center;
            transition: all 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .warning-tag { display: inline-block; font-size: 11px; color: #ff2a55; border: 1px solid rgba(255, 42, 85, 0.5); background: rgba(255, 42, 85, 0.1); padding: 4px 12px; letter-spacing: 3px; margin-bottom: 18px; text-transform: uppercase; }
        .glitch { font-size: 24px; font-weight: bold; letter-spacing: 4px; color: #fff; position: relative; text-shadow: 0 0 10px rgba(0, 255, 170, 0.6); margin-bottom: 12px; }
        .sub-info { font-size: 13px; color: #7da196; line-height: 1.5; min-height: 45px; margin-bottom: 25px; }
        .scanner-wrapper { position: relative; width: 110px; height: 110px; margin: 0 auto 15px; border-radius: 50%; border: 1px dashed rgba(0, 255, 170, 0.4); display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; background: radial-gradient(circle, rgba(0,255,170,0.08) 0%, transparent 70%); }
        .scanner-wrapper.scanning { border-color: #00ffaa; box-shadow: 0 0 25px rgba(0, 255, 170, 0.4); transform: scale(1.05); }
        .fingerprint-svg { width: 60px; height: 60px; fill: none; stroke: rgba(0, 255, 170, 0.6); stroke-width: 2; stroke-linecap: round; transition: stroke 0.3s; }
        .scanner-wrapper.scanning .fingerprint-svg { stroke: #00ffaa; }
        .laser { position: absolute; top: 10%; left: 10%; width: 80%; height: 2px; background: #00ffaa; box-shadow: 0 0 12px #00ffaa, 0 0 20px #00ffaa; opacity: 0; pointer-events: none; }
        .scanner-wrapper.scanning .laser { opacity: 1; animation: scanMove 1.2s infinite alternate ease-in-out; }
        .scan-hint { font-size: 12px; letter-spacing: 2px; color: #00ffaa; text-transform: uppercase; animation: pulse 2s infinite; }
        .sys-logs { margin-top: 22px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.08); font-size: 10px; color: #4a665d; text-align: left; height: 42px; overflow: hidden; line-height: 1.4; }
        .video-stage { display: none; flex-direction: column; align-items: center; animation: fadeIn 0.8s ease forwards; }
        .feed-header { width: 100%; display: flex; justify-content: space-between; font-size: 11px; color: #00ffaa; margin-bottom: 10px; letter-spacing: 1px; }
        video { width: 100%; max-height: 65vh; border: 1px solid rgba(0, 255, 170, 0.4); border-radius: 4px; background: #000; box-shadow: 0 0 25px rgba(0, 255, 170, 0.15); }
        @keyframes scanMove { 0% { top: 15%; } 100% { top: 85%; } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <div class="crt-overlay"></div>
    <div class="hud-corner tl"></div><div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div><div class="hud-corner br"></div>
    <div class="rec-indicator"><div class="rec-dot"></div><span id="recText">SIGNAL INTERCEPTED</span></div>

    <div class="container" id="mainBox">
        <div id="lockScreen">
            <div class="warning-tag">UNKNOWN SOURCE // NODE 09</div>
            <div class="glitch" id="glitchTitle">ДОСТУП ЗАКРЫТ</div>
            <div class="sub-info" id="typewriter"></div>
            <div class="scanner-wrapper" id="scanner">
                <div class="laser"></div>
                <svg class="fingerprint-svg" viewBox="0 0 24 24">
                    <path d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"/>
                </svg>
            </div>
            <div class="scan-hint" id="scanHint">УДЕРЖИВАЙТЕ ПАЛЕЦ ДЛЯ СКАНИРОВАНИЯ</div>
            <div class="sys-logs" id="sysLogs">&gt; Ожидание биометрического ключа...<br>&gt; Шифрование: AES-256-GCM [АКТИВНО]</div>
        </div>

        <div class="video-stage" id="videoStage">
            <div class="feed-header"><span>ARCHIVE_FILE_01.MP4</span><span style="color:#ff2a55;">● DECRYPTED</span></div>
            <video id="secretVideo" controls playsinline preload="auto">
                <source src="ВСТАВЬ_СЮДА_ССЫЛКУ_ИЗ_SUPABASE" type="video/mp4">
            </video>
        </div>
    </div>

    <script>
        const introText = "Обнаружен скрытый пакет данных. Личность отправителя не установлена. Подтвердите присутствие...";
        let charIndex = 0;
        const typeEl = document.getElementById('typewriter');
        function typeEffect() {
            if (charIndex < introText.length) {
                typeEl.innerHTML += introText.charAt(charIndex);
                charIndex++;
                setTimeout(typeEffect, 35);
            }
        }
        setTimeout(typeEffect, 400);

        const titleEl = document.getElementById('glitchTitle');
        const origTitle = "ДОСТУП ЗАКРЫТ";
        const glitchChars = "!<>-_\\/[]{}—=+*^?#________";
        setInterval(() => {
            if (Math.random() > 0.82) {
                titleEl.innerText = origTitle.split('').map(c => Math.random() > 0.7 ? glitchChars[Math.floor(Math.random() * glitchChars.length)] : c).join('');
                setTimeout(() => { titleEl.innerText = origTitle; }, 120);
            }
        }, 1500);

        const scanner = document.getElementById('scanner');
        const scanHint = document.getElementById('scanHint');
        const sysLogs = document.getElementById('sysLogs');
        let holdTimer = null, progress = 0, unlocked = false;

        function startScan(e) {
            if (unlocked) return;
            e.preventDefault();
            scanner.classList.add('scanning');
            scanHint.style.color = "#fff";
            holdTimer = setInterval(() => {
                progress += 5;
                scanHint.innerText = `ИДЕНТИФИКАЦИЯ... ${progress}%`;
                if (progress === 30) sysLogs.innerHTML = "&gt; Анализ отпечатка...<br>&gt; Обход защиты узла #09...";
                if (progress === 70) sysLogs.innerHTML = "&gt; Ключ принят!<br>&gt; Дешифровка видеопотока...";
                if (progress >= 100) {
                    clearInterval(holdTimer);
                    unlocked = true;
                    scanHint.innerText = "ДОСТУП РАЗРЕШЕН";
                    document.getElementById('recText').innerText = "CONNECTION ESTABLISHED";
                    document.getElementById('recText').style.color = "#00ffaa";
                    setTimeout(() => {
                        document.getElementById('lockScreen').style.display = 'none';
                        document.getElementById('mainBox').style.maxWidth = '650px';
                        document.getElementById('videoStage').style.display = 'flex';
                        document.getElementById('secretVideo').play().catch(() => {});
                    }, 500);
                }
            }, 80);
        }

        function stopScan() {
            if (unlocked) return;
            clearInterval(holdTimer);
            scanner.classList.remove('scanning');
            progress = 0;
            scanHint.innerText = "УДЕРЖИВАЙТЕ ПАЛЕЦ ДЛЯ СКАНИРОВАНИЯ";
            scanHint.style.color = "#00ffaa";
        }

        scanner.addEventListener('mousedown', startScan);
        scanner.addEventListener('touchstart', startScan);
        window.addEventListener('mouseup', stopScan);
        const titleEl = document.getElementById('glitchTitle');
        const origTitle = "ДОСТУП ЗАКРЫТ";
        const glitchChars = "!<>-_\\/[]{}—=+*^?#________";
        setInterval(() => {
            if (Math.random() > 0.82) {
                let glitched = origTitle.split('').map(c => Math.random() > 0.7 ? glitchChars[Math.floor(Math.random() * glitchChars.length)] : c).join('');
                titleEl.innerText = glitched;
                setTimeout(() => { titleEl.innerText = origTitle; }, 120);
            }
        }, 1500);

        const scanner = document.getElementById('scanner');
        const scanHint = document.getElementById('scanHint');
        const sysLogs = document.getElementById('sysLogs');
        let holdTimer = null;
        let progress = 0;
        let unlocked = false;

        function startScan(e) {
            if (unlocked) return;
            e.preventDefault();
            scanner.classList.add('scanning');
            scanHint.style.color = "#fff";
            
            holdTimer = setInterval(() => {
                progress += 5;
                scanHint.innerText = `ИДЕНТИФИКАЦИЯ... ${progress}%`;
                
                if (progress === 30) sysLogs.innerHTML = "&gt; Анализ отпечатка...<br>&gt; Обход защиты узла #09...";
                if (progress === 70) sysLogs.innerHTML = "&gt; Ключ принят!<br>&gt; Дешифровка видеопотока...";

                if (progress >= 100) {
                    clearInterval(holdTimer);
                    unlocked = true;
                    unlockArchive();
                }
            }, 80);
        }

        function stopScan() {
            if (unlocked) return;
            clearInterval(holdTimer);
            scanner.classList.remove('scanning');
            progress = 0;
            scanHint.innerText = "УДЕРЖИВАЙТЕ ПАЛЕЦ ДЛЯ СКАНИРОВАНИЯ";
            scanHint.style.color = "#00ffaa";
        }

        scanner.addEventListener('mousedown', startScan);
        scanner.addEventListener('touchstart', startScan);
        window.addEventListener('mouseup', stopScan);
        window.addEventListener('touchend', stopScan);

        function unlockArchive() {
            scanHint.innerText = "ДОСТУП РАЗРЕШЕН";
            document.getElementById('recText').innerText = "CONNECTION ESTABLISHED";
            document.getElementById('recText').style.color = "#00ffaa";
            
            setTimeout(() => {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('mainBox').style.maxWidth = '650px';
                document.getElementById('videoStage').style.display = 'flex';
                
                const video = document.getElementById('secretVideo');
                video.play().catch(() => {});
            }, 500);
        }

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        const particles = Array.from({ length: 45 }, () => ({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 1.8 + 0.5,
            vx: (Math.random() - 0.5) * 0.4,
            vy: (Math.random() - 0.5) * 0.4
        }));

        function animateBg() {
            ctx.clearRect(0, 0, w, h);
            
            const time = Date.now() * 0.001;
            const radius = 120 + Math.sin(time) * 15;
            ctx.beginPath();
            ctx.arc(w / 2, h / 2, radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0, 255, 170, 0.06)';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.fillStyle = 'rgba(0, 255, 170, 0.45)';
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > w) p.vx *= -1;
                if (p.y < 0 || p.y > h) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    const dx = p.x - particles[j].x;
                    const dy = p.y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 100) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0, 255, 170, ${0.12 * (1 - dist / 100)})`;
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(animateBg);
        }
        animateBg();
        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
