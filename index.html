<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Эпоха — империя на 100 дней</title>
<style>
:root{--bg:#0f1224;--bg2:#221a4d;--pn:rgba(255,255,255,.06);--pn2:rgba(255,255,255,.11);--ink:#f2efff;--mu:#a9a3d6;--ln:rgba(255,255,255,.13);--ac:#f5b942;--ac2:#3ddc97;--bad:#ff6b81;--sh:rgba(0,0,0,.35)}
[data-theme=parch]{--bg:#f4ecd8;--bg2:#e6d4aa;--pn:rgba(90,58,12,.07);--pn2:rgba(90,58,12,.13);--ink:#3b2a14;--mu:#7b6541;--ln:rgba(90,58,12,.22);--ac:#b8731a;--ac2:#2c8a58;--bad:#b3261e;--sh:rgba(90,58,12,.2)}
[data-theme=emerald]{--bg:#05211d;--bg2:#0d4a40;--pn:rgba(255,255,255,.06);--pn2:rgba(255,255,255,.11);--ink:#e8fff6;--mu:#8fc9b6;--ln:rgba(255,255,255,.13);--ac:#ffd166;--ac2:#4be3b0;--bad:#ff7a7a;--sh:rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.4;padding-bottom:86px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 82%,transparent));backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding:10px 14px 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:980px;margin:0 auto}
.top h1{margin:0;font-size:1.25rem;letter-spacing:-.01em}.top small{color:var(--mu)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:980px;margin:8px auto 0}
.chip{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:6px 10px;min-width:0}
.chip b{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip small{color:var(--mu);font-size:.72rem;white-space:nowrap}
main{max-width:980px;margin:0 auto;padding:14px;display:grid;gap:12px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:20px;padding:14px;box-shadow:0 8px 24px var(--sh)}
.card h2,.card h3{margin:0 0 4px}.mu{color:var(--mu);font-size:.88rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.btn{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#ff7a45));color:#241400;font-weight:700;border-radius:14px;padding:9px 16px;transition:transform .12s,filter .12s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn.sec{background:var(--pn2);color:var(--ink);font-weight:600}.btn.big{padding:12px 20px;text-align:center}
.btn small{display:block;font-weight:600;opacity:.8}
.costs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.cc{background:var(--pn2);border-radius:999px;padding:2px 10px;font-size:.85rem}.cc.no{color:var(--bad);font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--pn2);overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac2),var(--ac));transition:width .4s}
.tm{display:flex;justify-content:space-between;font-size:.88rem;color:var(--mu)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:4px;overflow-x:auto;padding:8px 8px max(8px,env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--ln);scrollbar-width:none}
nav button{flex:1 0 66px;display:grid;justify-items:center;gap:0;padding:6px 4px;border-radius:12px;color:var(--mu);font-size:.72rem}
nav button span{font-size:1.25rem}nav button.on{background:var(--pn2);color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.cell{aspect-ratio:1;border-radius:9px;background:var(--pn);border:1px solid var(--ln);display:grid;place-items:center;font-size:.7rem;color:var(--mu);position:relative}
.cell.done{background:color-mix(in srgb,var(--ac2) 30%,transparent);color:var(--ink)}.cell.next{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset;color:var(--ink)}
.cell.big{border-color:var(--ac)}
.hero{display:grid;gap:2px;text-align:center;padding:10px;border-radius:16px;background:var(--pn);border:1px solid var(--ln)}
.hero.off{opacity:.38;filter:grayscale(1)}.hero .em{font-size:2rem}
.r1{color:#c9c9d8}.r2{color:#6fdc8c}.r3{color:#5ea8ff}.r4{color:#c77dff}.r5{color:#ffb347}
.ach{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--pn);border:1px solid var(--ln);opacity:.5}.ach.on{opacity:1;border-color:var(--ac)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:90;max-width:92vw;box-shadow:0 8px 28px var(--sh);animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}
.ov{position:fixed;inset:0;background:rgba(6,4,20,.62);backdrop-filter:blur(5px);display:grid;place-items:center;z-index:60;padding:12px}
.md{background:linear-gradient(160deg,var(--bg2),var(--bg));border:1px solid var(--ln);border-radius:22px;padding:18px;width:min(560px,100%);max-height:88vh;overflow:auto;display:grid;gap:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs .btn{padding:6px 12px}
input,textarea,select{font:inherit;background:var(--pn2);color:var(--ink);border:1px solid var(--ln);border-radius:12px;padding:8px 12px;max-width:100%}
textarea{width:100%;height:120px;font-size:.78rem}
.log{font-size:.85rem;color:var(--mu);display:grid;gap:3px;max-height:220px;overflow:auto}
.stat{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--ln)}
@media (max-width:560px){.chips{grid-template-columns:repeat(2,1fr)}.cal{grid-template-columns:repeat(7,1fr)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.bar i,.btn{transition:none}}
</style>
</head>
<body>
<header>
  <div class="top"><div><h1 id="ttl">Эпоха</h1><small id="sub"></small></div><div class="mu" id="clk"></div></div>
  <div class="chips" id="chips"></div>
</header>
<main id="view"></main>
<nav id="nav" aria-label="Разделы"></nav>

<script>
(()=>{
const $=i=>document.getElementById(i),KEY="epoha-save-v1";
const RI={gold:"🪙",food:"🌾",wood:"🪵",gem:"💎"},RN={gold:"Золото",food:"Еда",wood:"Дерево",gem:"Кристаллы"},RL=["gold","food","wood","gem"];
const SU=["","К","М","Млрд","Трлн","Квдр","Квнт","Скст","Спт","Окт"];
const sh=n=>{n=Math.floor(n);if(n<1000)return""+n;const i=Math.min(SU.length-1,Math.floor(Math.log10(n)/3)),v=n/Math.pow(10,i*3);return(v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v))+SU[i]};
const rt=x=>x<10?x.toFixed(2):sh(x);
const ft=s=>{s=Math.max(0,Math.ceil(s));const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),c=s%60;return d?d+"д "+h+"ч":h?h+"ч "+m+"м":m?m+"м "+c+"с":c+"с"};
const ERAS=["Каменный век","Бронзовый век","Античность","Средневековье","Возрождение","Эпоха пара","Индустриализация","Атомный век","Цифровая эра","Космическая эра"];
const BLD=[
{id:"farm",n:"Ферма",i:"🌾",res:"food",r:.8,c:{gold:15},d:"Выращивает еду",e:1},
{id:"sawmill",n:"Лесопилка",i:"🪵",res:"wood",r:.6,c:{gold:20,food:10},d:"Добывает дерево",e:1},
{id:"mine",n:"Золотой рудник",i:"⛏️",res:"gold",r:.5,c:{wood:25,food:15},d:"Приносит золото",e:1},
{id:"storage",n:"Склад",i:"🏚️",c:{wood:80,gold:50},d:"Увеличивает вместимость",e:1},
{id:"market",n:"Рынок",i:"🏪",c:{gold:120,wood:80,food:50},d:"+3% к добыче золота за уровень",e:1},
{id:"barracks",n:"Казармы",i:"🏰",c:{gold:100,wood:60},d:"+4% к силе героев за уровень",e:2},
{id:"library",n:"Библиотека",i:"📚",c:{gold:150,wood:100},d:"+4% к скорости исследований",e:2},
{id:"temple",n:"Храм",i:"⛩️",res:"gem",r:.002,c:{gold:500,wood:300},d:"Приносит кристаллы",e:3}];
const TECH=[
{id:"agri",n:"Земледелие",i:"🌱",d:"+12% еды за уровень"},{id:"forest",n:"Лесоводство",i:"🌲",d:"+12% дерева за уровень"},
{id:"mining",n:"Горное дело",i:"⛰️",d:"+12% золота за уровень"},{id:"store",n:"Логистика",i:"📦",d:"+15% вместимости за уровень"},
{id:"scholar",n:"Письменность",i:"📜",d:"+3% скорости исследований"},{id:"war",n:"Военное дело",i:"⚔️",d:"+10% силы героев и наград походов"},
{id:"trade",n:"Торговля",i:"⚖️",d:"+5% к выгоде обмена"},{id:"wonder",n:"Чудеса света",i:"🗿",d:"+5% ко всей добыче"}];
const HR=[["Лучник Ори","🏹",1],["Крестьянин Ян","🧑‍🌾",1],["Охотница Лея","🦌",1],["Кузнец Бран","🔨",1],["Рыцарь Эйрик","🛡️",2],["Целительница Мира","🌿",2],["Следопыт Кай","🧭",2],["Алхимик Зол","⚗️",2],["Маг Аркон","🔮",3],["Капитан Вега","⚓",3],["Тень Ниакс","🥷",3],["Жрица Сола","🌞",3],["Дракон Игнис","🐉",4],["Валькирия Хельга","⚔️",4],["Король Артур","👑",5],["Звёздный Страж","🌌",5]];
const EXP=[{n:"Разведка",t:900,i:"🔭"},{n:"Охота",t:3600,i:"🏹"},{n:"Караван",t:14400,i:"🐪"},{n:"Дальняя экспедиция",t:43200,i:"⛵"},{n:"Великий поход",t:86400,i:"🏔️"}];
const QK={gold:"Добыть {n} золота",up:"Улучшить здания {n} раз",exp:"Завершить походов: {n}",sum:"Призвать героев: {n}",click:"Собрать налоги {n} раз"};
const LS=[["prod","Имперская мощь","+10% к добыче"],["cap","Великие склады","+20% вместимости"],["rs","Мудрость предков","+10% к скорости исследований"]];

const def=()=>{const b={};BLD.forEach(x=>b[x.id]=["farm","mine","sawmill"].includes(x.id)?1:0);
return{off:0,spd:1,mult:1,last:Date.now(),res:{gold:60,food:40,wood:40,gem:30},bl:b,era:1,eraEnd:0,tech:{},rs:[],slots:1,heroes:{},exp:[],xslots:2,
day:{n:0,last:""},q:{date:"",l:[]},ach:{},st:{gold:0,run:0,clicks:0,up:0,exp:0,sum:0,ev:0,pr:0,maxEra:1,trade:0},legT:0,leg:0,ls:{},sumDay:"",log:[],evT:0,theme:"night",snd:true,pw:"admin",born:Date.now()}};
const merge=(a,b)=>{for(const k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k]))merge(a[k],b[k]);else a[k]=b[k]}return a};
let S=def(),tab="emp",adminOk=false,admTab="res";
try{const r=localStorage.getItem(KEY);if(r)S=merge(def(),JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const now=()=>Date.now()+S.off,today=()=>new Date(now()).toDateString();

/* звук и сообщения */
let ac=null;const beep=(f,d=.12,ty="triangle")=>{if(!S.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=ty;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.5,t+d);g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}};
const toast=m=>{const e=document.createElement("div");e.className="toast";e.textContent=m;e.setAttribute("role","status");document.body.appendChild(e);setTimeout(()=>e.remove(),3400)};
const logm=m=>{S.log.unshift({t:now(),m});S.log.length=Math.min(S.log.length,40)};

/* формулы */
const tb=id=>S.tech[id]||0,lup=k=>S.ls[k]||0,eraM=()=>Math.pow(3.2,S.era-1),legM=()=>1+.1*S.legT;
const cap=()=>5000*Math.pow(1.2,S.bl.storage)*Math.pow(4,S.era-1)*(1+.15*tb("store"))*(1+.2*lup("cap"));
const maxL=()=>5+5*S.era;
const rates=()=>{const r={gold:0,food:0,wood:0,gem:0},m=eraM()*legM()*S.mult*(1+.05*tb("wonder"))*(1+.1*lup("prod")),tm={food:tb("agri"),wood:tb("forest"),gold:tb("mining")};
BLD.forEach(b=>{if(!b.res)return;const L=S.bl[b.id];if(L<=0)return;let x=b.res==="gem"?b.r*L*S.mult:b.r*L*m*(1+.12*(tm[b.res]||0));if(b.res==="gold")x*=1+.03*S.bl.market;r[b.res]+=x});return r};
const bcost=b=>{const c={},k=Math.pow(1.16,S.bl[b.id])*Math.pow(2.2,S.era-1);for(const r in b.c)c[r]=Math.ceil(b.c[r]*k);return c};
const afford=c=>Object.keys(c).every(r=>S.res[r]>=c[r]),pay=c=>{for(const r in c)S.res[r]-=c[r]};
const addRes=(r,v)=>{if(r==="gem"){S.res.gem+=v;return}const c=cap();S.res[r]=S.res[r]>=c?S.res[r]:Math.min(c,S.res[r]+v)};
const rsSpeed=()=>1+.04*S.bl.library+.03*tb("scholar")+.1*lup("rs");
const tcost=l=>({gold:Math.round(250*Math.pow(1.55,l)*eraM()),food:Math.round(120*Math.pow(1.55,l)*eraM())});
const tdur=l=>1200*Math.pow(1.5,l)/rsSpeed();
const eraCost=()=>{const k=Math.pow(5,S.era-1);return{gold:3000*k,food:1500*k,wood:1500*k,gem:20*S.era}};
const eraDur=()=>4*3600*S.era;
const taxVal=()=>Math.max(2,rates().gold*6+eraM()*2);
const hp=i=>{const h=S.heroes[i];return h?HR[i][2]*5*(1+.25*(h.lv-1)):0};
const party=()=>Object.keys(S.heroes).map(i=>hp(+i)).sort((a,b)=>b-a).slice(0,3).reduce((a,b)=>a+b,0)*(1+.04*S.bl.barracks+.1*tb("war"));
const cnt=()=>Object.keys(S.heroes).length;
const prGain=()=>Math.floor(Math.sqrt(S.st.run/1e7));
const xr=(k,pw)=>{const T=EXP[k],R=rates(),pm=(1+pw/60)*(1+.1*tb("war")),e=eraM();
return{gold:Math.round(Math.max(150*e,R.gold*T.t*.6)*pm),food:Math.round(Math.max(100*e,R.food*T.t*.6)*pm),wood:Math.round(Math.max(100*e,R.wood*T.t*.6)*pm),gem:Math.max(1,Math.round(T.t/7200*(1+pw/200)))}};
const roll=()=>{const w=[45,30,15,8,2],r=Math.random()*100;let a=0,rar=1;for(let i=0;i<5;i++){a+=w[i];if(r<a){rar=i+1;break}}const p=HR.map((h,i)=>i).filter(i=>HR[i][2]===rar);return p[Math.floor(Math.random()*p.length)]};
const give=i=>{if(S.heroes[i]){S.heroes[i].sh++;return false}S.heroes[i]={lv:1,sh:0};return true};
const dayRew=d=>{const R=rates(),s=(d-1)%100+1;return{gem:2+(s%7===0?10:0)+(s%30===0?40:0)+(s===100?400:0),gold:Math.round(500*eraM()+R.gold*600*(1+s/20)),hero:s%10===0}};

/* задания и достижения */
const mkQ=()=>{const R=rates();return Object.keys(QK).sort(()=>Math.random()-.5).slice(0,3).map(x=>({k:x,n:x==="gold"?Math.max(500,Math.round(R.gold*1800)):x==="up"?3+S.era:x==="exp"?2:x==="sum"?1:25,c:0,r:5+S.era,d:0}))};
const qp=(k,n)=>S.q.l.forEach(q=>{if(q.k===k&&!q.d)q.c=Math.min(q.n,q.c+n)});
const ACH=[],A=(id,n,f,r)=>ACH.push({id,n,f,r});
[1e3,1e5,1e7,1e9,1e12,1e15].forEach(v=>A("g"+v,`Добыть ${sh(v)} золота за всё время`,()=>S.st.gold>=v,5+Math.floor(Math.log10(v))));
[10,100,1000,10000].forEach(v=>A("c"+v,`Собрать налоги ${v} раз`,()=>S.st.clicks>=v,5));
[10,50,200,1000].forEach(v=>A("u"+v,`Улучшить здания ${v} раз`,()=>S.st.up>=v,6));
[1,5,25,100].forEach(v=>A("x"+v,`Завершить походов: ${v}`,()=>S.st.exp>=v,6));
[1,10,50,200].forEach(v=>A("s"+v,`Призвать героев: ${v}`,()=>S.st.sum>=v,6));
[2,4,6,8,10].forEach(v=>A("e"+v,`Достичь эры «${ERAS[v-1]}»`,()=>S.st.maxEra>=v,10));
[1,3,10].forEach(v=>A("p"+v,`Возрождений: ${v}`,()=>S.st.pr>=v,20));
[1,7,30,60,100].forEach(v=>A("d"+v,`Получить ежедневных наград: ${v}`,()=>S.day.n>=v,8));
[5,10,15].forEach(v=>A("t"+v,`Довести науку до уровня ${v}`,()=>TECH.some(t=>tb(t.id)>=v),12));
[4,8,16].forEach(v=>A("h"+v,`Собрать героев: ${v}`,()=>cnt()>=v,10));
[10,50].forEach(v=>A("m"+v,`Совершить сделок на рынке: ${v}`,()=>S.st.trade>=v,6));

/* случайные события */
const EV=[
{t:"Бродячий торговец",d:"Торговец предлагает редкий кристалл за часть вашего золота.",o:[["Купить (−15% золота)",()=>{S.res.gold*=.85;S.res.gem+=3;return"Вы получили 3 💎"}],["Отказаться",()=>"Торговец ушёл дальше."]]},
{t:"Засуха",d:"Поля сохнут. Можно потратить дерево на колодцы или рискнуть.",o:[["Построить колодцы (−20% дерева)",()=>{S.res.wood*=.8;addRes("food",rates().food*900);return"Урожай спасён: еда пополнена."}],["Рискнуть",()=>{if(Math.random()<.5){S.res.food*=.7;return"Потеряно 30% еды."}addRes("food",rates().food*1800);return"Повезло! Пошли дожди, урожай удвоился."}]]},
{t:"Находка в шахте",d:"Рабочие нашли странную жилу. Копать глубже?",o:[["Копать глубже",()=>{if(Math.random()<.6){addRes("gold",rates().gold*2400+500*eraM());return"Жила богата золотом!"}S.res.wood*=.9;return"Обвал. Потеряно 10% дерева."}],["Закрыть шахту",()=>"Вы решили не рисковать."]]},
{t:"Бродячий герой",d:"Путник просится на службу в вашу империю.",o:[["Принять",()=>{const i=roll();return give(i)?`К вам присоединился герой: ${HR[i][0]}!`:`${HR[i][0]} уже служит у вас: +1 осколок.`}],["Накормить и отпустить",()=>{S.res.food*=.95;S.res.gem+=1;return"Путник благодарен и оставил 1 💎"}]]},
{t:"Праздник урожая",d:"Народ просит устроить праздник.",o:[["Устроить (−10% еды)",()=>{S.res.food*=.9;addRes("gold",rates().gold*1500);return"Праздник удался: казна пополнена."}],["Отказать",()=>"Люди разочарованы, но всё спокойно."]]},
{t:"Древняя библиотека",d:"Учёные нашли свитки и просят средства на их изучение.",o:[["Профинансировать (−10% золота)",()=>{S.res.gold*=.9;S.res.gem+=4;return"Свитки раскрыли тайны: +4 💎"}],["Отложить",()=>"Свитки отправлены в архив."]]}];

/* ядро: тик */
const accrue=dt=>{const R=rates(),c=cap();["gold","food","wood"].forEach(r=>{const b=S.res[r],add=R[r]*dt*S.spd;if(b<c)S.res[r]=Math.min(c,b+add);const g=S.res[r]-b;if(r==="gold"&&g>0){S.st.gold+=g;S.st.run+=g;qp("gold",g)}});S.res.gem+=R.gem*dt*S.spd};
const finishExp=x=>{const T=EXP[x.k],r=xr(x.k,x.pw);["gold","food","wood"].forEach(k=>addRes(k,r[k]));S.res.gem+=r.gem;S.st.exp++;qp("exp",1);
let extra="";if(Math.random()<.25+T.t/200000){const i=roll();extra=give(i)?` Новый герой: ${HR[i][0]}!`:` Осколок героя: ${HR[i][0]}.`}
const m=`Поход «${T.n}» завершён: +${sh(r.gold)}🪙 +${sh(r.food)}🌾 +${sh(r.wood)}🪵 +${r.gem}💎.${extra}`;logm(m);toast(m)};
const timers=n=>{let ch=false;
S.rs=S.rs.filter(x=>{if(n>=x.end){S.tech[x.id]=tb(x.id)+1;const t=TECH.find(y=>y.id===x.id),m=`Исследование завершено: «${t.n}» → ур. ${S.tech[x.id]}`;logm(m);toast(m);beep(700);ch=true;return false}return true});
if(S.eraEnd&&n>=S.eraEnd){S.eraEnd=0;S.era++;S.st.maxEra=Math.max(S.st.maxEra,S.era);const m=`Новая эра: «${ERAS[S.era-1]}»!`;logm(m);toast(m);beep(520,.4);ch=true}
S.exp=S.exp.filter(x=>{if(n>=x.end){finishExp(x);ch=true;return false}return true});
if(ch)render()};
const checks=()=>{if(S.q.date!==today()){S.q={date:today(),l:mkQ()}}
ACH.forEach(a=>{if(!S.ach[a.id]&&a.f()){S.ach[a.id]=1;S.res.gem+=a.r;const m=`Достижение: ${a.n} (+${a.r}💎)`;logm(m);toast(m);beep(880,.3)}})};
const tick=()=>{const n=now(),dt=Math.max(0,(n-S.last)/1000);S.last=n;if(dt>0)accrue(dt);timers(n);checks();
if(!S.evT)S.evT=n+10*60000;if(n>=S.evT&&!document.hidden&&!document.querySelector(".ov")){S.evT=n+(20+Math.random()*20)*60000;showEvent(EV[Math.floor(Math.random()*EV.length)])}};

/* окна */
const modal=(html,cls)=>{const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="md ${cls||""}">${html}</div>`;o.onclick=e=>{if(e.target===o&&!o.dataset.lock)o.remove()};document.body.appendChild(o);return o};
const showEvent=e=>{const o=modal(`<h2>${e.t}</h2><p>${e.d}</p>${e.o.map((x,i)=>`<button class="btn ${i?"sec":""}" data-a="ev" data-i="${i}">${x[0]}</button>`).join("")}`);o.dataset.lock=1;o.dataset.ev=EV.indexOf(e);beep(440)};

/* вёрстка вкладок */
const cc=c=>Object.keys(c).map(r=>`<span class="cc" data-r="${r}" data-v="${c[r]}">${RI[r]} ${sh(c[r])}</span>`).join("");
const tmr=(label,end,dur)=>`<div class="tm"><span>${label}</span><b data-cd="${end}"></b></div><div class="bar"><i data-end="${end}" data-dur="${dur}"></i></div>`;
const TABS=[["emp","🏛️","Империя"],["sci","🔬","Наука"],["her","🦸","Герои"],["exp","🧭","Походы"],["day","📅","Календарь"],["qst","📜","Задания"],["mkt","⚖️","Рынок"],["ach","🏆","Награды"],["more","⚙️","Ещё"]];

const vEmp=()=>{const R=rates();let h=`<div class="card"><div class="row"><div><div class="mu">Эра ${S.era} из 10</div><h2>${ERAS[S.era-1]}</h2><div class="mu">Лимит уровня зданий: ${maxL()}</div></div><button class="btn big" data-a="tax">⚒ Собрать налоги<small>+${sh(taxVal())} 🪙</small></button></div>`;
if(S.era<10){if(S.eraEnd)h+=tmr(`Строится «${ERAS[S.era]}»`,S.eraEnd,eraDur());else h+=`<div class="mu" style="margin-top:8px">Следующая эра «${ERAS[S.era]}» · ${ft(eraDur())}</div><div class="costs">${cc(eraCost())}</div><button class="btn" data-a="era">Начать переход</button>`}
h+=`</div>`;
if(S.era>=4){const g=prGain();h+=`<div class="card"><div class="row"><div><h3>🔥 Возрождение</h3><div class="mu">Сбросить эру и здания ради Наследия: +10% к добыче навсегда за очко. Герои, наука, награды и календарь сохраняются.</div></div><button class="btn ${g<1?"sec":""}" data-a="pres">Возродиться (+${g})</button></div></div>`}
h+=`<div class="grid">`;
BLD.forEach(b=>{const L=S.bl[b.id],lock=S.era<b.e;let x="";if(b.res){const m=eraM()*legM()*S.mult*(1+.05*tb("wonder"))*(1+.1*lup("prod"));x=`<div class="mu">Добыча: ${rt(R[b.res]*0+(b.res==="gem"?b.r*L*S.mult:b.r*L*m*(1+.12*({food:tb("agri"),wood:tb("forest"),gold:tb("mining")}[b.res]||0))))}/с</div>`}
h+=`<div class="card"><div class="row"><h3>${b.i} ${b.n}</h3><span class="mu">ур. ${L}/${maxL()}</span></div><div class="mu">${b.d}</div>${x}`;
if(lock)h+=`<div class="mu">🔒 Откроется в эре «${ERAS[b.e-1]}»</div>`;else if(L>=maxL())h+=`<div class="mu">Достигнут предел для этой эры</div>`;else h+=`<div class="costs">${cc(bcost(b))}</div><button class="btn" data-a="up" data-id="${b.id}">${L?"Улучшить":"Построить"}</button>`;h+=`</div>`});
return h+`</div>`};

const vSci=()=>{let h=`<div class="card"><h2>Исследования</h2><div class="mu">Слотов: ${S.rs.length}/${S.slots} · скорость ×${rsSpeed().toFixed(2)}</div>`;
S.rs.forEach(x=>{const t=TECH.find(y=>y.id===x.id);h+=tmr(`${t.i} ${t.n} → ур. ${tb(x.id)+1}`,x.end,x.dur)});
if(S.slots<3)h+=`<div style="margin-top:8px"><button class="btn sec" data-a="slot">Открыть слот №${S.slots+1} · ${S.slots===1?100:500} 💎</button></div>`;
h+=`</div><div class="grid">`;
TECH.forEach(t=>{const l=tb(t.id),run=S.rs.some(x=>x.id===t.id);h+=`<div class="card"><div class="row"><h3>${t.i} ${t.n}</h3><span class="mu">ур. ${l}/15</span></div><div class="mu">${t.d}</div>`;
if(l>=15)h+=`<div class="mu">Максимум</div>`;else if(run)h+=`<div class="mu">Изучается…</div>`;else h+=`<div class="costs">${cc(tcost(l))}</div><div class="mu">Время: ${ft(tdur(l))}</div><button class="btn" data-a="res" data-id="${t.id}">Исследовать</button>`;h+=`</div>`});
return h+`</div>`};

const vHer=()=>{const free=S.sumDay!==today();let h=`<div class="card"><div class="row"><div><h2>Призыв героев</h2><div class="mu">Сила отряда (лучшие 3): ${sh(party())} · героев: ${cnt()}/${HR.length}</div></div><button class="btn big" data-a="sum">${free?"Бесплатный призыв":"Призвать"}<small>${free?"раз в день":"40 💎"}</small></button></div></div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">`;
HR.forEach((x,i)=>{const o=S.heroes[i];h+=`<div class="hero ${o?"":"off"}"><div class="em">${x[1]}</div><b>${x[0]}</b><div class="r${x[2]}">${"★".repeat(x[2])}</div>`;
if(o){h+=`<div class="mu">ур. ${o.lv} · сила ${sh(hp(i))}</div><div class="mu">осколки: ${o.sh}/${o.lv}</div>`;if(o.lv<30)h+=`<div class="costs" style="justify-content:center">${cc({gold:Math.round(300*o.lv*o.lv*eraM())})}</div><button class="btn sec" data-a="hup" data-id="${i}">Усилить</button>`}else h+=`<div class="mu">Не призван</div>`;h+=`</div>`});
return h+`</div>`};

const vExp=()=>{const pw=party();let h=`<div class="card"><h2>Походы</h2><div class="mu">Слотов: ${S.exp.length}/${S.xslots} · сила отряда ${sh(pw)}. Награды зависят от добычи и силы героев.</div>`;
S.exp.forEach(x=>{h+=tmr(`${EXP[x.k].i} ${EXP[x.k].n}`,x.end,x.dur)});h+=`</div><div class="grid">`;
EXP.forEach((T,k)=>{const r=xr(k,pw);h+=`<div class="card"><h3>${T.i} ${T.n}</h3><div class="mu">Длительность: ${ft(T.t)}</div><div class="costs"><span class="cc">🪙 ${sh(r.gold)}</span><span class="cc">🌾 ${sh(r.food)}</span><span class="cc">🪵 ${sh(r.wood)}</span><span class="cc">💎 ${r.gem}</span></div><div class="mu">Шанс найти героя</div><button class="btn" data-a="xs" data-id="${k}">Отправить</button></div>`});
return h+`</div>`};

const vDay=()=>{const n=S.day.n,pg=n>0?Math.floor((n-1)/100):0,done=n-pg*100,can=S.day.last!==today(),nd=n+1,r=dayRew(nd);
let h=`<div class="card"><div class="row"><div><h2>Ежедневная награда</h2><div class="mu">Получено дней: ${n} · цель: 100 дней и дальше (сезон ${pg+1})</div></div><button class="btn big ${can?"":"sec"}" data-a="dclaim">${can?"Забрать день "+nd:"Завтра ждёт награда"}<small>${can?`+${r.gem}💎 +${sh(r.gold)}🪙${r.hero?" + герой":""}`:"приходи позже"}</small></button></div></div><div class="card"><div class="cal">`;
for(let i=1;i<=100;i++){const big=i%10===0||i===100,cls=i<=done?"done":(i===done+1&&can?"next":"");h+=`<div class="cell ${cls} ${big?"big":""}" title="День ${i}">${i<=done?"✓":i===100?"👑":big?"🎁":i}</div>`}
return h+`</div></div>`};

const vQst=()=>{let h=`<div class="card"><h2>Задания дня</h2><div class="mu">Обновляются каждый день</div></div>`;
S.q.l.forEach((q,i)=>{h+=`<div class="card"><div class="row"><b>${QK[q.k].replace("{n}",sh(q.n))}</b><span class="mu">${sh(q.c)}/${sh(q.n)}</span></div><div class="bar"><i style="width:${100*q.c/q.n}%"></i></div>${q.d?`<div class="mu">Награда получена ✓</div>`:`<button class="btn ${q.c>=q.n?"":"sec"}" data-a="qc" data-id="${i}">Забрать ${q.r} 💎</button>`}</div>`});
h+=`<div class="card"><h3>Хроника</h3><div class="log">${S.log.map(l=>`<div>${new Date(l.t).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})} — ${l.m}</div>`).join("")||"Пока пусто."}</div></div>`;return h};

const price=k=>1+.25*Math.sin(now()/3600000+k*2)+.02*tb("trade")*2.5;
const TR=[["food","gold","Продать еду"],["wood","gold","Продать дерево"],["gold","food","Купить еду"],["gold","wood","Купить дерево"]];
const vMkt=()=>{let h=`<div class="card"><h2>Рынок</h2><div class="mu">Курс меняется каждый час. Обмен ${"20%"} выбранного ресурса.</div></div><div class="grid">`;
TR.forEach((t,k)=>{const f=S.res[t[0]]*.2,gain=Math.floor(f*price(k)*(t[1]==="gold"?.9:1.1));h+=`<div class="card"><h3>${t[2]}</h3><div class="mu">${RI[t[0]]} ${sh(f)} → ${RI[t[1]]} ${sh(gain)} (курс ×${price(k).toFixed(2)})</div><button class="btn" data-a="trade" data-id="${k}">Обменять</button></div>`});
return h+`</div>`};

const vAch=()=>{const n=ACH.filter(a=>S.ach[a.id]).length;return`<div class="card"><h2>Награды: ${n} из ${ACH.length}</h2><div class="bar"><i style="width:${100*n/ACH.length}%"></i></div></div><div class="grid">`+ACH.map(a=>`<div class="ach ${S.ach[a.id]?"on":""}"><span style="font-size:1.6rem">${S.ach[a.id]?"🏆":"🔒"}</span><div><b>${a.n}</b><div class="mu">+${a.r} 💎</div></div></div>`).join("")+`</div>`};

const vMore=()=>{const days=Math.floor((Date.now()-S.born)/864e5);let h=`<div class="card"><h2>Наследие</h2><div class="mu">Очков: ${S.leg} · всего заработано: ${S.legT} (+${S.legT*10}% к добыче)</div><div class="grid" style="margin-top:8px">`;
LS.forEach(x=>{const l=lup(x[0]);h+=`<div class="card"><b>${x[1]}</b> <span class="mu">ур. ${l}</span><div class="mu">${x[2]}</div><button class="btn ${S.leg>=3*(l+1)?"":"sec"}" data-a="ls" data-id="${x[0]}">Улучшить · ${3*(l+1)} очк.</button></div>`});
h+=`</div></div><div class="card"><h2>Статистика</h2>`;
[["Дней с начала игры",days],["Золота добыто",sh(S.st.gold)],["Налогов собрано",S.st.clicks],["Улучшений",S.st.up],["Походов",S.st.exp],["Призывов",S.st.sum],["Событий",S.st.ev],["Возрождений",S.st.pr],["Эра",S.era+" из 10"]].forEach(r=>h+=`<div class="stat"><span>${r[0]}</span><b>${r[1]}</b></div>`);
h+=`</div><div class="card"><h2>Настройки</h2><div class="row" style="justify-content:flex-start">`;
[["night","Ночь"],["parch","Пергамент"],["emerald","Изумруд"]].forEach(t=>h+=`<button class="btn ${S.theme===t[0]?"":"sec"}" data-a="theme" data-id="${t[0]}">${t[1]}</button>`);
h+=`<button class="btn sec" data-a="snd">Звук: ${S.snd?"вкл":"выкл"}</button></div><p class="mu">Сохранение (скопируй, чтобы перенести):</p><textarea id="exp" readonly>${JSON.stringify(S)}</textarea><p class="mu">Вставь сохранение и нажми «Загрузить»:</p><textarea id="imp"></textarea>
<div class="row" style="justify-content:flex-start"><button class="btn sec" data-a="imp">Загрузить</button><button class="btn sec" data-a="adm">Админка</button><button class="btn sec" data-a="reset" style="color:var(--bad)">Начать заново</button></div></div>`;return h};
const V={emp:vEmp,sci:vSci,her:vHer,exp:vExp,day:vDay,qst:vQst,mkt:vMkt,ach:vAch,more:vMore};
const render=()=>{const y=scrollY;$("view").innerHTML=V[tab]();$("nav").innerHTML=TABS.map(t=>`<button class="${t[0]===tab?"on":""}" data-a="tab" data-id="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join("");document.documentElement.dataset.theme=S.theme;scrollTo(0,y);live()};
const live=()=>{const n=now(),R=rates(),c=cap();
$("chips").innerHTML=RL.map(r=>`<div class="chip"><small>${RI[r]} ${RN[r]}</small><b>${sh(S.res[r])}</b><small>${rt(R[r]*S.spd)}/с${r==="gem"?"":" · лимит "+sh(c)}</small></div>`).join("");
$("ttl").textContent="Эпоха · "+ERAS[S.era-1];$("sub").textContent=`День игры ${Math.floor((Date.now()-S.born)/864e5)+1}`;$("clk").textContent=S.spd>1?`×${S.spd}`:"";
document.querySelectorAll("[data-cd]").forEach(e=>e.textContent=ft((+e.dataset.cd-n)/1000));
document.querySelectorAll("[data-end]").forEach(e=>e.style.width=Math.max(0,Math.min(100,100*(1-(+e.dataset.end-n)/(+e.dataset.dur*1000))))+"%");
document.querySelectorAll("[data-r]").forEach(e=>e.classList.toggle("no",S.res[e.dataset.r]<+e.dataset.v))};

/* действия */
const no=()=>{toast("Не хватает ресурсов");beep(180,.15,"sawtooth")};
const act=(a,id,el)=>{
if(a.startsWith("ad_"))return adm(a,id,el);
if(a==="tab"){tab=id;scrollTo(0,0);render();return}
if(a==="tax"){addRes("gold",taxVal());S.st.clicks++;S.st.gold+=taxVal();S.st.run+=taxVal();qp("click",1);qp("gold",taxVal());beep(600,.06)}
else if(a==="up"){const b=BLD.find(x=>x.id===id),c=bcost(b);if(S.bl[id]>=maxL()||S.era<b.e)return;if(!afford(c))return no();pay(c);S.bl[id]++;S.st.up++;qp("up",1);beep(520,.1)}
else if(a==="era"){const c=eraCost();if(!afford(c))return no();pay(c);S.eraEnd=now()+eraDur()*1000;logm("Начато строительство новой эры");beep(400,.3)}
else if(a==="res"){const l=tb(id);if(S.rs.length>=S.slots)return toast("Все слоты исследований заняты");const c=tcost(l);if(!afford(c))return no();pay(c);const d=tdur(l);S.rs.push({id,end:now()+d*1000,dur:d});beep(480,.2)}
else if(a==="slot"){const p=S.slots===1?100:500;if(S.res.gem<p)return no();S.res.gem-=p;S.slots++;beep(700)}
else if(a==="sum"){const free=S.sumDay!==today();if(free)S.sumDay=today();else{if(S.res.gem<40)return no();S.res.gem-=40}const i=roll(),nw=give(i);S.st.sum++;qp("sum",1);const m=nw?`Новый герой: ${HR[i][0]} ${"★".repeat(HR[i][2])}`:`${HR[i][0]}: +1 осколок`;logm(m);modal(`<h2 style="text-align:center">${HR[i][1]}</h2><h3 style="text-align:center" class="r${HR[i][2]}">${HR[i][0]}</h3><p style="text-align:center">${nw?"Новый герой!":"Уже есть: +1 осколок"}</p><button class="btn" data-a="close">Отлично</button>`);beep(660+HR[i][2]*100,.4)}
else if(a==="hup"){const o=S.heroes[id],c=Math.round(300*o.lv*o.lv*eraM());if(o.sh<o.lv)return toast(`Нужно осколков: ${o.lv}`);if(S.res.gold<c)return no();S.res.gold-=c;o.sh-=o.lv;o.lv++;beep(760)}
else if(a==="xs"){if(S.exp.length>=S.xslots)return toast("Все слоты походов заняты");if(!cnt())return toast("Сначала призови героя");const T=EXP[id];S.exp.push({k:+id,end:now()+T.t*1000,dur:T.t,pw:party()});beep(500)}
else if(a==="dclaim"){if(S.day.last===today())return toast("Награда за сегодня уже получена");const d=S.day.n+1,r=dayRew(d);S.res.gem+=r.gem;addRes("gold",r.gold);if(r.hero){const i=roll();give(i);toast(`Бонусный герой: ${HR[i][0]}`)}S.day.n=d;S.day.last=today();if(d%100===0)modal(`<h2 style="text-align:center">👑 Легенда</h2><p style="text-align:center">Ты прошёл ${d} дней! Империя будет помнить это.</p><button class="btn" data-a="close">Продолжить</button>`);beep(840,.3)}
else if(a==="qc"){const q=S.q.l[id];if(q.d)return;if(q.c<q.n)return toast("Задание ещё не выполнено");q.d=1;S.res.gem+=q.r;beep(780)}
else if(a==="trade"){const t=TR[id],f=S.res[t[0]]*.2;if(f<1)return no();S.res[t[0]]-=f;addRes(t[1],Math.floor(f*price(+id)*(t[1]==="gold"?.9:1.1)));S.st.trade++;beep(560,.08)}
else if(a==="pres"){const g=prGain();if(g<1)return toast("Нужно добыть больше золота в этом забеге");if(!confirm(`Возродиться и получить ${g} очк. Наследия? Эра и здания сбросятся.`))return;S.leg+=g;S.legT+=g;S.st.pr++;const d=def();S.res=d.res;S.bl=d.bl;S.era=1;S.eraEnd=0;S.exp=[];S.st.run=0;S.q={date:"",l:[]};logm(`Возрождение: +${g} очк. Наследия`);beep(300,.6)}
else if(a==="ls"){const l=lup(id),c=3*(l+1);if(S.leg<c)return no();S.leg-=c;S.ls[id]=l+1;beep(700)}
else if(a==="theme")S.theme=id;else if(a==="snd")S.snd=!S.snd;
else if(a==="imp"){try{const t=JSON.parse($("imp").value);S=merge(def(),t);toast("Сохранение загружено")}catch(e){return toast("Не удалось прочитать сохранение")}}
else if(a==="reset"){if(confirm("Начать заново? Весь прогресс будет удалён.")){const t=S.theme;S=def();S.theme=t}else return}
else if(a==="adm"){openAdm();return}
else if(a==="close"){el.closest(".ov").remove();return}
else if(a==="ev"){const o=el.closest(".ov"),e=EV[+o.dataset.ev],m=e.o[+el.dataset.i][1]();S.st.ev++;logm(`${e.t}: ${m}`);o.dataset.lock="";o.querySelector(".md").innerHTML=`<h2>${e.t}</h2><p>${m}</p><button class="btn" data-a="close">Понятно</button>`}
save();render()};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)act(b.dataset.a,b.dataset.id||b.dataset.i,b)});

/* админка */
const AT=[["res","Ресурсы"],["time","Время"],["world","Мир"],["her","Герои"],["day","Календарь"],["ach","Награды"],["data","Данные"]];
let admO=null;
const openAdm=()=>{if(admO&&admO.isConnected)return;admO=modal("");admO.dataset.adm=1;drawAdm()};
const drawAdm=()=>{if(!admO)return;const m=admO.querySelector(".md");
if(!adminOk){m.innerHTML=`<h2>Админка</h2><p class="mu">Введи пароль (по умолчанию: admin)</p><div class="row"><input id="adpw" type="password" autocomplete="off"><button class="btn" data-a="ad_login">Войти</button></div><button class="btn sec" data-a="close">Закрыть</button>`;return}
let h=`<div class="row"><h2 style="margin:0">Админка</h2><button class="btn sec" data-a="close">Закрыть</button></div><div class="tabs">${AT.map(t=>`<button class="btn ${t[0]===admTab?"":"sec"}" data-a="ad_tab" data-id="${t[0]}">${t[1]}</button>`).join("")}</div>`;
const inp=(id,v,w)=>`<input id="${id}" type="number" value="${v}" style="width:${w||120}px">`;
if(admTab==="res")h+=`<div class="row" style="justify-content:flex-start">${inp("adn",1000)}</div><div class="row" style="justify-content:flex-start">${RL.map(r=>`<button class="btn sec" data-a="ad_add" data-id="${r}">+ ${RI[r]}</button>`).join("")}<button class="btn sec" data-a="ad_max">Заполнить склады</button><button class="btn sec" data-a="ad_zero">Обнулить</button></div>
<p class="mu">Множитель добычи: ×${S.mult}</p><div class="row" style="justify-content:flex-start">${[1,2,10,100,1000,1e6].map(v=>`<button class="btn ${S.mult===v?"":"sec"}" data-a="ad_mult" data-id="${v}">×${sh(v)}</button>`).join("")}</div>`;
if(admTab==="time")h+=`<p class="mu">Скорость времени для добычи: ×${S.spd}. Сдвиг времени: ${(S.off/3600000).toFixed(1)} ч.</p><div class="row" style="justify-content:flex-start">${[1,5,20,100,1000].map(v=>`<button class="btn ${S.spd===v?"":"sec"}" data-a="ad_spd" data-id="${v}">×${v}</button>`).join("")}</div>
<p class="mu">Перемотать время вперёд (таймеры, добыча и календарь сдвинутся):</p><div class="row" style="justify-content:flex-start">${[["1 ч",1],["6 ч",6],["1 день",24],["7 дней",168],["30 дней",720]].map(x=>`<button class="btn sec" data-a="ad_shift" data-id="${x[1]}">+${x[0]}</button>`).join("")}</div><div class="row" style="justify-content:flex-start"><button class="btn" data-a="ad_done">Завершить все таймеры</button><button class="btn sec" data-a="ad_ev">Вызвать событие</button></div>`;
if(admTab==="world")h+=`<div class="row" style="justify-content:flex-start">${inp("ade",S.era,70)}<button class="btn sec" data-a="ad_era">Установить эру (1–10)</button></div><div class="row" style="justify-content:flex-start"><button class="btn sec" data-a="ad_bl">Здания на максимум</button><button class="btn sec" data-a="ad_tech">Наука на 15</button><button class="btn sec" data-a="ad_tech0">Сбросить науку</button><button class="btn sec" data-a="ad_slots">Все слоты</button></div><div class="row" style="justify-content:flex-start">${inp("adl",10,70)}<button class="btn sec" data-a="ad_leg">+ очки Наследия</button></div>`;
if(admTab==="her")h+=`<div class="row" style="justify-content:flex-start"><button class="btn sec" data-a="ad_hall">Выдать всех героев</button><button class="btn sec" data-a="ad_hsh">+10 осколков всем</button><button class="btn sec" data-a="ad_hlv">Все на ур. 10</button><button class="btn sec" data-a="ad_hno">Удалить героев</button><button class="btn sec" data-a="ad_sumr">Сбросить бесплатный призыв</button></div>`;
if(admTab==="day")h+=`<p class="mu">Получено дней: ${S.day.n}</p><div class="row" style="justify-content:flex-start">${inp("add",S.day.n,90)}<button class="btn sec" data-a="ad_day">Установить число дней</button></div><div class="row" style="justify-content:flex-start"><button class="btn sec" data-a="ad_dres">Сбросить сегодняшний claim</button><button class="btn sec" data-a="ad_qres">Новые задания</button></div>`;
if(admTab==="ach")h+=`<div class="row" style="justify-content:flex-start"><button class="btn sec" data-a="ad_aall">Открыть все</button><button class="btn sec" data-a="ad_ano">Закрыть все</button></div>`;
if(admTab==="data")h+=`<p class="mu">JSON сохранения (можно править и применить):</p><textarea id="adj">${JSON.stringify(S,null,1).replace(/</g,"&lt;")}</textarea><div class="row" style="justify-content:flex-start"><button class="btn" data-a="ad_json">Применить JSON</button><button class="btn sec" data-a="ad_hard" style="color:var(--bad)">Полный сброс</button></div><div class="row" style="justify-content:flex-start"><input id="adnp" placeholder="Новый пароль"><button class="btn sec" data-a="ad_pw">Сменить пароль</button></div>`;
m.innerHTML=h};
const adm=(a,id,el)=>{const v=i=>+($(i)&&$(i).value)||0;
if(a==="ad_login"){if($("adpw").value===S.pw){adminOk=true}else toast("Неверный пароль");drawAdm();return}
if(!adminOk)return;
if(a==="ad_tab")admTab=id;
else if(a==="ad_add"){const n=Math.max(0,v("adn"));if(id==="gem")S.res.gem+=n;else S.res[id]+=n;if(id==="gold")S.st.run+=n}
else if(a==="ad_max"){const c=cap();["gold","food","wood"].forEach(r=>S.res[r]=c)}
else if(a==="ad_zero")RL.forEach(r=>S.res[r]=0);
else if(a==="ad_mult")S.mult=+id;else if(a==="ad_spd")S.spd=+id;
else if(a==="ad_shift"){S.off+=+id*3600000}
else if(a==="ad_done"){S.rs.forEach(x=>x.end=0);S.exp.forEach(x=>x.end=0);if(S.eraEnd)S.eraEnd=1}
else if(a==="ad_ev"){S.evT=1}
else if(a==="ad_era"){S.era=Math.max(1,Math.min(10,Math.round(v("ade"))||1));S.st.maxEra=Math.max(S.st.maxEra,S.era);S.eraEnd=0}
else if(a==="ad_bl"){BLD.forEach(b=>{if(S.era>=b.e)S.bl[b.id]=maxL()})}
else if(a==="ad_tech")TECH.forEach(t=>S.tech[t.id]=15);else if(a==="ad_tech0")S.tech={};
else if(a==="ad_slots"){S.slots=3;S.xslots=4}
else if(a==="ad_leg"){const n=Math.round(v("adl"));S.leg+=n;S.legT+=Math.max(0,n)}
else if(a==="ad_hall")HR.forEach((h,i)=>{if(!S.heroes[i])S.heroes[i]={lv:1,sh:0}});
else if(a==="ad_hsh")Object.keys(S.heroes).forEach(i=>S.heroes[i].sh+=10);
else if(a==="ad_hlv")Object.keys(S.heroes).forEach(i=>S.heroes[i].lv=Math.max(S.heroes[i].lv,10));
else if(a==="ad_hno")S.heroes={};else if(a==="ad_sumr")S.sumDay="";
else if(a==="ad_day")S.day.n=Math.max(0,Math.round(v("add")));
else if(a==="ad_dres")S.day.last="";else if(a==="ad_qres")S.q={date:"",l:[]};
else if(a==="ad_aall")ACH.forEach(x=>S.ach[x.id]=1);else if(a==="ad_ano")S.ach={};
else if(a==="ad_json"){try{S=merge(def(),JSON.parse($("adj").value.replace(/&lt;/g,"<")));toast("Применено")}catch(e){return toast("Ошибка в JSON")}}
else if(a==="ad_hard"){if(!confirm("Удалить весь прогресс?"))return;S=def()}
else if(a==="ad_pw"){const p=$("adnp").value.trim();if(!p)return toast("Введи пароль");S.pw=p;toast("Пароль изменён")}
save();render();drawAdm()};
document.addEventListener("keydown",e=>{if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==="a"){e.preventDefault();openAdm()}if(e.key==="Escape"){const o=document.querySelector(".ov:not([data-lock])");if(o)o.remove()}});
$("ttl").addEventListener("click",(()=>{let n=0,t=0;return()=>{const c=Date.now();n=c-t<600?n+1:1;t=c;if(n>=5){n=0;openAdm()}}})());

/* запуск */
const before={...S.res};tick();
render();
{const gone=Math.round((Date.now()-(+localStorage.getItem(KEY+"-ts")||Date.now()))/1000);if(gone>120){const m=["gold","food","wood"].map(r=>`+${sh(Math.max(0,S.res[r]-before[r]))}${RI[r]}`).join(" ");toast(`Пока тебя не было ${ft(gone)}: ${m}`)}}
setInterval(()=>{tick();live()},500);
setInterval(()=>{save();try{localStorage.setItem(KEY+"-ts",Date.now())}catch(e){}},5000);
addEventListener("beforeunload",()=>{save();try{localStorage.setItem(KEY+"-ts",Date.now())}catch(e){}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){tick();render()}});
window.EPOHA={get S(){return S},act,tick,render};
})();
</script>
</body>
