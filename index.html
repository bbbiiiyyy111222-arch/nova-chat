<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>allWATCH — Твой Телеканал</title>
  
  <!-- Плеер Plyr -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0d11;
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      margin-bottom: 20px;
      text-align: center;
    }
    .logo {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .logo span { color: #ff3b30; }
    .live-badge {
      background: #ff3b30;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      vertical-align: middle;
      margin-left: 8px;
      font-weight: bold;
    }

    .main-container {
      width: 100%;
      max-width: 960px;
      background: #16161e;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .video-info { padding: 15px 20px; }
    .video-title { font-size: 1.2rem; font-weight: 600; }
    :root { --plyr-color-main: #ff3b30; }
  </style>
</head>
<body>

  <header>
    <div class="logo">all<span>WATCH</span><span class="live-badge">LIVE</span></div>
  </header>

  <div class="main-container">
    <video id="player" controls playsinline></video>
    <div class="video-info">
      <div id="title" class="video-title">Загрузка эфира...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

  <script>
    // Подключение к твоему новому проекту Supabase
    const SUPABASE_URL = 'https://ipzafxhymzaguthbmaki.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwemFmeGh5bXphZ3V0aGJtYWtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMjk0ODYsImV4cCI6MjEwNDgwNTQ4Nn0.zeWHC0Mu3YYPzMIWEwS4Ca8EMqK-QrnQPLP_nfVwu0E';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const player = new Plyr('#player', {
      controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
      autoplay: true
    });

    async function fetchCurrentVideo() {
      const { data, error } = await supabaseClient
        .from('videos')
        .select('*')
        .order('id', { ascending: false })
        .limit(1);

      if (error) {
        console.error('Ошибка Supabase:', error);
        document.getElementById('title').innerText = 'Ошибка загрузки';
        return;
      }

      if (data && data.length > 0) {
        const currentVideo = data[0];
        
        player.source = {
          type: 'video',
          title: currentVideo.title,
          sources: [{ src: currentVideo.direct_url, type: 'video/mp4' }],
          poster: currentVideo.poster_url || ''
        };

        document.getElementById('title').innerText = currentVideo.title;
      } else {
        document.getElementById('title').innerText = 'В базе пока нет записей';
      }
    }

    fetchCurrentVideo();
  </script>

</body>
</html>
